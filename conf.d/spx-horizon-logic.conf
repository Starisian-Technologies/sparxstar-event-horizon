# "Nothing malicious escapes."
#
# DEPLOYMENT: Copy this file to /etc/nginx/conf.d/ exactly ONCE.
# Do NOT add an nginx include pointing at the cloned repository directory.
# If nginx reports "map_hash_bucket_size directive is duplicate", you have a
# double-include — check that no other nginx.conf path loads this file again.
# ======================================================================

# 1. KERNEL & WORKER OPTIMIZATION
# ----------------------------------------------------------------------
# IMPORTANT: map_hash_bucket_size MUST appear before all map{} blocks.
# On nginx 1.24+, the first map{} initialises the hash internally; any
# explicit map_hash_bucket_size after that is treated as a duplicate.
map_hash_bucket_size 128;
map_hash_max_size 4096;
variables_hash_bucket_size 128;
variables_hash_max_size 4096;

# Drop connections immediately on timeout or flood (Ghosting)
reset_timedout_connection on;
limit_conn_status 444; # Ghost flooders
limit_req_status 444;  # Ghost brute-forcers

# Hardening against Smuggling & Invalid Headers
ignore_invalid_headers on;
underscores_in_headers off;

# 2. REAL-IP SAFETY GUARD
# ----------------------------------------------------------------------
# After the RealIP module runs (spx-cloudflare-trust.conf), $remote_addr is
# always the validated client IP. The CF-Connecting-IP value is only loaded
# into $remote_addr for TCP peers within the trusted Cloudflare IP ranges, so
# direct-to-origin traffic cannot manipulate it via forged headers.
# $spx_real_ip is kept as a clean alias for clarity and backward compatibility.
map $remote_addr $spx_real_ip {
    default $remote_addr;
}

# 3. ZONES (DDoS & FLOOD PROTECTION)
# ----------------------------------------------------------------------
# Rate limiting keyed on the validated real client IP.
limit_conn_zone $spx_real_ip zone=spx_conn:10m;
limit_req_zone  $spx_real_ip zone=spx_req:10m rate=20r/s;

# 4. EMERGENCY BYPASS
# ----------------------------------------------------------------------
# Firewall is disabled ONLY for the trusted admin IP(s) listed below.
# This bypass is keyed on $spx_real_ip — the actual TCP peer IP after the
# RealIP module has run. It cannot be activated by forged headers.
# IMPORTANT: use your admin/operator EGRESS IP (e.g. home or VPN exit node),
# NOT the server's own public IP. Replace the example below before deploying.
# To add/remove admin IPs, edit this map and reload Nginx.
map $spx_real_ip $spx_firewall_active {
    default 1;
    127.0.0.1 0;
    ::1 0;
    # 203.0.113.45 0;   # TODO: replace with your admin/operator egress IP — emergency bypass
}

# 5. LOGGING FILTER
# ----------------------------------------------------------------------
# Only log requests that trigger the firewall (Status 444 or 403)
map $status $spx_log_trigger {
    444 1;
    403 1;
    default 0;
}

# 6. THREAT INTELLIGENCE MAPS (The 8G Logic)
# ----------------------------------------------------------------------

# Bad Query Strings (SQLi, XSS, RCE)
map $query_string $spx_bad_query {
    default 0;
    "~*(order(\s|%20)by(\s|%20)1--)" 1;
    "~*(union.*select|concat.*\()" 1;
    "~*(base64_(en|de)code|benchmark|curl_exec|proc_open|shell_exec|wget)" 1;
    "~*(etc/(passwd|shadow|hosts)|boot\.ini|win\.ini)" 1;
    "~*(localhost|127\.0\.0\.1|loopback)" 1;
    "~*(GLOBALS|REQUEST|mosConfig|xp_cmdshell)" 1;
}

# Bad URI Patterns (Shells, Sensitive Files)
map $request_uri $spx_bad_uri {
    default 0;
    "~*(/)(etc|var|opt|usr|bin|sbin|proc)(/)" 1;
    "~*(\.(git|svn|hg|env|bak|inc|old|sql|conf|ini|sh|cgi|pl|py|exe|jsp|asp))$" 1;
    "~*(wp-config\.php|\.htaccess|\.htpasswd|debug\.log|error\.log)" 1;
    "~*(/)(adminer|phpmyadmin|root|sql|backup|shell|c99|r57|wso)(/|\.php)" 1;
    "~*(eval\(|base64_decode|python|perl|nmap|nikto|scan)" 1;
}

# Bad User Agents
# Empty UA policy: block by default, allow only listed IPs
map $spx_real_ip $spx_empty_ua_is_bad {
    default 1;      # empty UA is BAD unless allowlisted
    127.0.0.1 0;
    ::1 0;
    # 203.0.113.45 0;   # TODO: add monitor/VPN egress IP(s)
}

map $http_user_agent $spx_bad_bot {
    default 0;
    "~*(360Spider|80legs|Abonti|Acunetix|AhrefsBot|BackDoor|Baiduspider|Bytespider)" 1;
    "~*(Censys|Claudio|CPython|DirBuster|DotBot|Ezooms|FHscan|Go-http-client)" 1;
    "~*(Heritrix|HTTrack|Indy Library|Java|libwww-perl|LieBaoFast|LinkpadBot)" 1;
    "~*(Masscan|MegaIndex|MJ12bot|Nikto|Nmap|OpenVAS|Semalt|sqlmap|Wget|Xenu|Zgrab)" 1;
    # Empty UA handling (conditional)
    "" $spx_empty_ua_is_bad;
}

# Bad Referrers
map $http_referer $spx_bad_referer {
    default 0;
    "~*(100dollars|best-seo|blue\spill|cocaine|ejaculat|erectile|hoodia)" 1;
    "~*(levitra|libido|lipitor|phentermin|pornhelm|tramadol|viagra|vicodin|xanax)" 1;
}

# 7. BEHAVIORAL MAPS
# ----------------------------------------------------------------------

# Strict POST Content-Type Validation
map $request_method:$http_content_type $spx_bad_post {
    default 0;
    # Allow: Form-Data, UrlEncoded, JSON, XML
    "~^POST:(?!.*(application/x-www-form-urlencoded|multipart/form-data|application/json|text/xml|application/xml))" 1;
}

# Fake Trackbacks
map "$request_uri:$http_user_agent" $spx_fake_trackback {
    default 0;
    "~*/trackback/.*:(Mozilla|Opera|Firefox|Chrome|Safari)" 1;
}

# Comment Spam (No Referer)
map "$request_method:$request_uri:$http_referer" $spx_comment_spam {
    default 0;
    "~^POST:.*wp-comments-post\.php:$" 1;
}

# 8. THE EVENT HORIZON (AGGREGATION)
# ----------------------------------------------------------------------
# Combines all threat maps. If any vector returns 1, result is 1.
map "$spx_bad_query:$spx_bad_uri:$spx_bad_bot:$spx_bad_referer:$spx_bad_post:$spx_fake_trackback:$spx_comment_spam" $spx_threat_detected {
    default 0;
    "~1" 1;
}

# 9. FINAL DECISION MATRIX
# ----------------------------------------------------------------------
# Combines threat status with firewall activation into a single binary.
# 1:1 = Firewall ON + Threat FOUND  -> Block (1)
# 1:0 = Firewall ON + No Threat     -> Pass  (0)
# 0:1 = Firewall OFF + Threat FOUND -> Pass  (0) [bypass active]
# 0:0 = Firewall OFF + No Threat    -> Pass  (0)
map "$spx_firewall_active:$spx_threat_detected" $spx_final_decision {
    default 0;
    "1:1"   1;
}
