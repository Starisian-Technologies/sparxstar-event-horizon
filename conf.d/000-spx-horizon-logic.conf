# ======================================================================
# SPARXSTAR EVENT HORIZON v2.0 [LOGIC CORE]
# Copyright (c) 2026 Starisian Technologies. All Rights Reserved.
# Proprietary / Closed Source.
# "Nothing malicious escapes."
#
# DEPLOYMENT: Copy this file to /etc/nginx/conf.d/ exactly ONCE.
# The "000-" prefix ensures this file loads FIRST (alphabetically) so that
# map_hash_bucket_size is always declared before any map{} block from other
# conf.d files. Do NOT rename it to remove the "000-" prefix.
# Do NOT add an nginx include pointing at the cloned repository directory.
# If nginx reports "map_hash_bucket_size directive is duplicate", you have a
# double-include — check that no other nginx.conf path loads this file again.
# ======================================================================

# 1. KERNEL & WORKER OPTIMIZATION
# ----------------------------------------------------------------------
# IMPORTANT: map_hash_bucket_size MUST appear before all map{} blocks.
# On nginx 1.24+, the first map{} initialises the hash internally; any
# explicit map_hash_bucket_size after that is treated as a duplicate.
map_hash_bucket_size 128;
map_hash_max_size 4096;
variables_hash_bucket_size 128;
variables_hash_max_size 4096;

# Drop connections immediately on timeout or flood (Ghosting)
reset_timedout_connection on;
limit_conn_status 444; # Ghost flooders
limit_req_status 444;  # Ghost brute-forcers

# Hardening against Smuggling & Invalid Headers
ignore_invalid_headers on;
underscores_in_headers off;

# 2. REAL-IP SAFETY GUARD
# ----------------------------------------------------------------------
# After the RealIP module runs (spx-cloudflare-trust.conf), $remote_addr is
# always the validated client IP. The CF-Connecting-IP value is only loaded
# into $remote_addr for TCP peers within the trusted Cloudflare IP ranges, so
# direct-to-origin traffic cannot manipulate it via forged headers.
# $spx_real_ip is kept as a clean alias for clarity and backward compatibility.
map $remote_addr $spx_real_ip {
    default $remote_addr;
}

# 3. ZONES (DDoS & FLOOD PROTECTION)
# ----------------------------------------------------------------------
# Rate limiting keyed on the validated real client IP.
limit_conn_zone $spx_real_ip zone=spx_conn:10m;
limit_req_zone  $spx_real_ip zone=spx_req:10m rate=20r/s;

# Per-route zones — finer-grained limits for high-value endpoints.
# Keyed on $spx_real_ip (real visitor IP, not raw TCP peer) for accuracy
# behind Cloudflare. Uses spx_ prefix to coexist with any zones defined
# in a wrapping nginx.conf (e.g. MaximillianGroupInc/system-core).
limit_req_zone $spx_real_ip zone=spx_wp_login:10m   rate=5r/m;
limit_req_zone $spx_real_ip zone=spx_graphql:10m    rate=30r/m;
limit_req_zone $spx_real_ip zone=spx_submission:10m rate=20r/m;
limit_req_zone $spx_real_ip zone=spx_general:20m    rate=300r/m;

# 4. EMERGENCY BYPASS
# ----------------------------------------------------------------------
# Firewall is disabled ONLY for the trusted admin IP(s) listed below.
# This bypass is keyed on $spx_real_ip — the actual TCP peer IP after the
# RealIP module has run. It cannot be activated by forged headers.
# IMPORTANT: use your admin/operator EGRESS IP (e.g. home or VPN exit node),
# NOT the server's own public IP. Replace the example below before deploying.
# To add/remove admin IPs, edit this map and reload Nginx.
map $spx_real_ip $spx_firewall_active {
    default 1;
    127.0.0.1 0;  # spx-admin-bypass
    ::1 0;        # spx-admin-bypass
    # 203.0.113.45 0;   # TODO: replace with your admin/operator egress IP — emergency bypass
}

# 5. LOGGING FILTER
# ----------------------------------------------------------------------
# Only log requests that trigger the firewall (Status 444 or 403)
map $status $spx_log_trigger {
    444 1;
    403 1;
    default 0;
}

# 5a. CLOUDFLARE ORIGIN GATE VARIABLE
# ----------------------------------------------------------------------
# $spx_from_cloudflare = 1 when the TCP peer is a confirmed Cloudflare
# edge IP or loopback. Use this in server/location blocks to enforce a
# Cloudflare-only origin policy (return 444 when value is 0).
#
# ⚠  SYNC WARNING: The CIDR ranges in this geo{} block MUST MATCH the
# set_real_ip_from directives in spx-cloudflare-trust.conf exactly.
# Both lists are maintained separately because the RealIP module and the
# geo module require different directive syntax — there is no way to share
# a single source file between them without custom tooling.
# Whenever you run scripts/update_cloudflare.py to refresh
# spx-cloudflare-trust.conf, also update the entries below to match.
# Mismatches allow direct-to-origin requests to spoof $spx_from_cloudflare.
#
# This variable does NOT feed into $spx_threat_detected so that deployments
# without Cloudflare are not accidentally broken.
geo $realip_remote_addr $spx_from_cloudflare {
    default          0;
    # Loopback — local health checks / CI test runner
    127.0.0.1        1;
    ::1              1;
    # Cloudflare IPv4
    103.21.244.0/22  1;
    103.22.200.0/22  1;
    103.31.4.0/22    1;
    104.16.0.0/13    1;
    104.24.0.0/14    1;
    108.162.192.0/18 1;
    131.0.72.0/22    1;
    141.101.64.0/18  1;
    162.158.0.0/15   1;
    172.64.0.0/13    1;
    173.245.48.0/20  1;
    188.114.96.0/20  1;
    190.93.240.0/20  1;
    197.234.240.0/22 1;
    198.41.128.0/17  1;
    # Cloudflare IPv6
    2400:cb00::/32   1;
    2606:4700::/32   1;
    2803:f800::/32   1;
    2405:b500::/32   1;
    2405:8100::/32   1;
    2a06:98c0::/29   1;
    2c0f:f248::/32   1;
}

# 5b. COUNTRY RISK SIGNAL
# ----------------------------------------------------------------------
# $spx_high_risk_geo = 1 for countries with elevated abuse signal.
# This is a risk AMPLIFIER, not a standalone trigger:
#   geo=1 alone        → no block
#   geo=1 + any threat → block (via $spx_geo_amplified → $spx_threat_detected)
# See Section 8 for how it is wired into the aggregation.
#
# Country codes are loaded from an external file so operators can customise
# the list without editing this core config:
#   Deployment path: /etc/nginx/maps/high-risk-geo.map
#   Source file:     maps/high-risk-geo.map  (in this repository)
# After editing the map file, reload Nginx:
#   sudo nginx -t && sudo systemctl reload nginx
map $http_cf_ipcountry $spx_high_risk_geo {
    default 0;
    include /etc/nginx/maps/high-risk-geo.map;
    # If nginx fails with "open() ... failed (2: No such file or directory)",
    # the map file is missing. Copy maps/high-risk-geo.map from this repository
    # to /etc/nginx/maps/ and reload.
}

# 6. THREAT INTELLIGENCE MAPS (The 8G Logic)
# ----------------------------------------------------------------------

# Bad Query Strings (SQLi, XSS, RCE)
map $query_string $spx_bad_query {
    default 0;
    "~*(order(\s|%20)by(\s|%20)1--)" 1;
    "~*(union.*select|concat.*\()" 1;
    "~*(base64_(en|de)code|benchmark|curl_exec|proc_open|shell_exec|wget)" 1;
    "~*(etc/(passwd|shadow|hosts)|boot\.ini|win\.ini)" 1;
    "~*(localhost|127\.0\.0\.1|loopback)" 1;
    "~*(GLOBALS|REQUEST|mosConfig|xp_cmdshell)" 1;
}

# Bad URI Patterns (Shells, Sensitive Files)
map $request_uri $spx_bad_uri {
    default 0;
    "~*(/)(etc|var|opt|usr|bin|sbin|proc)(/)" 1;
    "~*(\.(git|svn|hg|env|bak|inc|old|sql|conf|ini|sh|cgi|pl|py|exe|jsp|asp))$" 1;
    "~*(wp-config\.php|\.htaccess|\.htpasswd|debug\.log|error\.log)" 1;
    "~*(/)(adminer|phpmyadmin|root|sql|backup|shell|c99|r57|wso)(/|\.php)" 1;
    "~*(eval\(|base64_decode|python|perl|nmap|nikto|scan)" 1;
}

# Bad User Agents
# Empty UA policy: block by default, allow only listed IPs
map $spx_real_ip $spx_empty_ua_is_bad {
    default 1;      # empty UA is BAD unless allowlisted
    127.0.0.1 0;
    ::1 0;
    # 203.0.113.45 0;   # TODO: add monitor/VPN egress IP(s)
}

map $http_user_agent $spx_bad_bot {
    default 0;
    "~*(360Spider|80legs|Abonti|Acunetix|AhrefsBot|BackDoor|Baiduspider|Bytespider)" 1;
    "~*(Censys|Claudio|CPython|DirBuster|DotBot|Ezooms|FHscan|Go-http-client)" 1;
    "~*(Heritrix|HTTrack|Indy Library|Java|libwww-perl|LieBaoFast|LinkpadBot)" 1;
    "~*(Masscan|MegaIndex|MJ12bot|Nikto|Nmap|OpenVAS|Semalt|sqlmap|Wget|Xenu|Zgrab)" 1;
    # Empty UA handling (conditional)
    "" $spx_empty_ua_is_bad;
}

# Bad Referrers
map $http_referer $spx_bad_referer {
    default 0;
    "~*(100dollars|best-seo|blue\spill|cocaine|ejaculat|erectile|hoodia)" 1;
    "~*(levitra|libido|lipitor|phentermin|pornhelm|tramadol|viagra|vicodin|xanax)" 1;
}

# 7. BEHAVIORAL MAPS
# ----------------------------------------------------------------------

# Strict POST Content-Type Validation
map $request_method:$http_content_type $spx_bad_post {
    default 0;
    # Allow: Form-Data, UrlEncoded, JSON, XML
    "~^POST:(?!.*(application/x-www-form-urlencoded|multipart/form-data|application/json|text/xml|application/xml))" 1;
}

# Fake Trackbacks
map "$request_uri:$http_user_agent" $spx_fake_trackback {
    default 0;
    "~*/trackback/.*:(Mozilla|Opera|Firefox|Chrome|Safari)" 1;
}

# Comment Spam (No Referer)
map "$request_method:$request_uri:$http_referer" $spx_comment_spam {
    default 0;
    "~^POST:.*wp-comments-post\.php:$" 1;
}

# 8. THE EVENT HORIZON (AGGREGATION)
# ----------------------------------------------------------------------
# Step 8a — base threat: combines all non-geo threat vectors.
# If any vector returns 1, result is 1.
map "$spx_bad_query:$spx_bad_uri:$spx_bad_bot:$spx_bad_referer:$spx_bad_post:$spx_fake_trackback:$spx_comment_spam" $spx_base_threat {
    default 0;
    "~1" 1;
}

# Step 8b — geo amplifier: fires only when BOTH high-risk country AND a
# base-threat signal are present.
#   $spx_high_risk_geo=1, $spx_base_threat=0  → 0  (geo alone: no block)
#   $spx_high_risk_geo=0, $spx_base_threat=1  → 0  (blocks via base threat in 8c, not via amplification)
#   $spx_high_risk_geo=1, $spx_base_threat=1  → 1  (amplified block)
map "$spx_high_risk_geo:$spx_base_threat" $spx_geo_amplified {
    default 0;
    "1:1"   1;
}

# Step 8c — final aggregation: block when base threat fires OR when the
# geo amplifier fires (which requires both geo AND another signal).
map "$spx_base_threat:$spx_geo_amplified" $spx_threat_detected {
    default 0;
    "~1" 1;
}

# 9. FINAL DECISION MATRIX
# ----------------------------------------------------------------------
# Combines threat status with firewall activation into a single binary.
# 1:1 = Firewall ON + Threat FOUND  -> Block (1)
# 1:0 = Firewall ON + No Threat     -> Pass  (0)
# 0:1 = Firewall OFF + Threat FOUND -> Pass  (0) [bypass active]
# 0:0 = Firewall OFF + No Threat    -> Pass  (0)
map "$spx_firewall_active:$spx_threat_detected" $spx_final_decision {
    default 0;
    "1:1"   1;
}

# 10. SPARXSTAR WORKER TRUST INFRASTRUCTURE
# ----------------------------------------------------------------------
# Allows Cloudflare Workers to pass trusted SPARXSTAR claim headers through
# the Nginx perimeter. The shared secret is stored in a separate file so it
# is never committed to this repository.
#
# Deployment: create /etc/nginx/secrets/worker-secret.conf with one line:
#   "your-shared-secret-value" 1;
# Then reload Nginx. Never commit the secret value.

# Step 1: verify the shared worker secret from the header.
map $http_x_worker_origin_secret $spx_worker_secret_ok {
    default 0;
    include /etc/nginx/secrets/worker-secret.conf;
}

# Step 2: only trust workers when the request is from Cloudflare (or another
# trusted proxy already encoded into $spx_from_cloudflare) AND the secret is OK.
map "$spx_from_cloudflare:$spx_worker_secret_ok" $spx_is_trusted_worker {
    default 0;
    "1:1"   1;
}

# Conditional SPARXSTAR header forwarding — empty string by default (strips
# spoofed headers from untrusted clients). Preserved only for verified
# Cloudflare Worker requests ($spx_is_trusted_worker = 1).
map $spx_is_trusted_worker $spx_pass_sparxstar_user      { default ""; 1 $http_x_sparxstar_user; }
map $spx_is_trusted_worker $spx_pass_sparxstar_session   { default ""; 1 $http_x_sparxstar_session; }
map $spx_is_trusted_worker $spx_pass_sparxstar_roles     { default ""; 1 $http_x_sparxstar_roles; }
map $spx_is_trusted_worker $spx_pass_sparxstar_issued    { default ""; 1 $http_x_sparxstar_issued; }
map $spx_is_trusted_worker $spx_pass_sparxstar_expires   { default ""; 1 $http_x_sparxstar_expires; }
map $spx_is_trusted_worker $spx_pass_sparxstar_site      { default ""; 1 $http_x_sparxstar_site; }
map $spx_is_trusted_worker $spx_pass_sparxstar_authlevel { default ""; 1 $http_x_sparxstar_authlevel; }
