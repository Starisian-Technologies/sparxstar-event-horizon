# 2. REAL-IP SAFETY GUARD
# ----------------------------------------------------------------------
# After the RealIP module runs (spx-cloudflare-trust.conf), $remote_addr
# is always the validated client IP. CF-Connecting-IP is only loaded for
# TCP peers within trusted Cloudflare IP ranges — direct-to-origin traffic
# cannot manipulate it via forged headers.
# $spx_real_ip is a clean alias for clarity and backward compatibility.
map $remote_addr $spx_real_ip {
    default $remote_addr;
}

# 3. RUNTIME LIMITING OWNERSHIP
# ----------------------------------------------------------------------
# limit_req_zone and limit_conn_zone are runtime concerns and must be
# defined by system-core in the http{} context (e.g., nginx.conf or an
# http-included conf.d file), not in the Event Horizon logic core.

# 4. EMERGENCY BYPASS
# ----------------------------------------------------------------------
# Firewall is disabled ONLY for the trusted admin IP(s) listed below.
# Keyed on $spx_real_ip — cannot be activated by forged headers.
# IMPORTANT: use your admin/operator EGRESS IP (home IP or VPN exit node),
# NOT the server's own public IP.
map $spx_real_ip $spx_firewall_active {
    default   1;
    127.0.0.1 0;  # spx-admin-bypass
    ::1       0;  # spx-admin-bypass
    # 203.0.113.45 0;  # TODO: replace with your admin/operator egress IP
}

# 5. LOGGING FILTER
# ----------------------------------------------------------------------
# Only log requests that trigger the firewall (status 444 or 403).
map $status $spx_log_trigger {
    444     1;
    403     1;
    default 0;
}

# 5a. CLOUDFLARE ORIGIN GATE VARIABLE [SPX]
# ----------------------------------------------------------------------
# $spx_from_cloudflare = 1 when the TCP peer is a confirmed Cloudflare
# edge IP or loopback. Use in server/location blocks to enforce a
# Cloudflare-only origin policy (return 444 when value is 0).
#
# SYNC WARNING: The CIDR ranges here MUST MATCH the set_real_ip_from
# directives in spx-cloudflare-trust.conf exactly. Both lists are
# maintained separately because the RealIP module and the geo module
# require different directive syntax. After running update_cloudflare.py
# to refresh spx-cloudflare-trust.conf, update the entries below to match.
# Mismatches allow direct-to-origin requests to spoof $spx_from_cloudflare.
#
# This variable does NOT feed into $spx_threat_detected so deployments
# without Cloudflare are not accidentally broken.
geo $realip_remote_addr $spx_from_cloudflare {
    default          0;
    127.0.0.1        1;
    ::1              1;
    103.21.244.0/22  1;
    103.22.200.0/22  1;
    103.31.4.0/22    1;
    104.16.0.0/13    1;
    104.24.0.0/14    1;
    108.162.192.0/18 1;
    131.0.72.0/22    1;
    141.101.64.0/18  1;
    162.158.0.0/15   1;
    172.64.0.0/13    1;
    173.245.48.0/20  1;
    188.114.96.0/20  1;
    190.93.240.0/20  1;
    197.234.240.0/22 1;
    198.41.128.0/17  1;
    2400:cb00::/32   1;
    2606:4700::/32   1;
    2803:f800::/32   1;
    2405:b500::/32   1;
    2405:8100::/32   1;
    2a06:98c0::/29   1;
    2c0f:f248::/32   1;
}

# 5b. COUNTRY RISK SIGNAL [SPX]
# ----------------------------------------------------------------------
# $spx_high_risk_geo = 1 for countries with elevated abuse signal.
# AMPLIFIER ONLY — geo=1 alone never triggers a block.
# geo=1 + any other threat signal = block (via $spx_geo_amplified).
# See Section 8 for the aggregation wiring.
#
# Country codes are in an external file so operators can customise the
# list without editing this core config.
# Deployment path: /etc/nginx/maps/high-risk-geo.map
# Source file:     maps/high-risk-geo.map (in this repository)
# After editing: sudo nginx -t && sudo systemctl reload nginx
map $http_cf_ipcountry $spx_high_risk_geo {
    default 0;
    include /etc/nginx/maps/high-risk-geo.map;
}

# ======================================================================
# 6. THREAT INTELLIGENCE MAPS
# Full 8G Firewall v1.5 coverage translated to http-context map directives.
# Each if-block rule from the original is represented as one or more
# map entries. Rule numbers reference the original 8G source.
# ======================================================================

# ----------------------------------------------------------------------
# 6a. BAD QUERY STRINGS — 8G:[QUERY STRING]
# 17 original if-blocks translated to map entries.
# Covers: SQLi, XSS, RCE, path traversal, PHP injection, header injection,
#         encoded attack sequences, dangerous function calls, global var abuse.
# ----------------------------------------------------------------------
map $query_string $spx_bad_query {
    default 0;

    # Rule 1 — long strings, null bytes, path/colon separators, special chars, FCK tools
    "~*^(%2d|-)[^=]+$" 1;
    "~*[a-z0-9]{4000,}" 1;
    "~*(/|%2f)(:|%3a)(/|%2f)" 1;
    "~*etc/(hosts|motd|shadow)" 1;
    "~*(`|<|>|\\^|\\||0x00|%00|%0d%0a)" 1;
    "~*(f?ckfinder|f?ckeditor|fullclick)" 1;

    # Rule 2 — header injection, localhost, command injection, global vars
    "~*((.*)header:|(.*)set-cookie:(.*)=)" 1;
    "~*(localhost|127(\\.|%2e)0(\\.|%2e)0(\\.|%2e)1)" 1;
    "~*(cmd|command)(=|%3d)(chdir|mkdir)" 1;
    "~*(globals|mosconfig([a-z_]{1,22})|(?<!SAML)request)(=|\\[)" 1;

    # Rule 3 — wp-config, timthumb, ftp:// path injection
    "~*(/|%2f)((wp-)?config)((\\.inc)?(\\.php))" 1;
    "~*(thumbs?(_editor|open)?|tim(thumbs?)?)((\\.php))" 1;
    "~*(absolute_|base|root_)(dir|path)(=|%3d)(ftp|https?)" 1;
    "~*(s)?(ftp|inurl|php)(s)?(:(/|%2f|%u2215)(/|%2f|%u2215))" 1;

    # Rule 4 — WordPress internal function abuse, passwd, path traversal
    "~*(\\.|20)(get|the)(_|%5f)(permalink|posts_page_url)(\\(|%28)" 1;
    "~*((boot|win)((\\.ini))|etc(/|%2f)passwd|self(/|%2f)environ)" 1;
    "~*(((/|%2f){3,})|((\\.|%2e){3,})|((\\.|%2e){2,})(/|%2f|%u2215))" 1;

    # Rule 5 — PHP function calls, UUID payloads, eval encoding
    "~*(benchmark|exec|fopen|function|html)(.*)(\\(|%28)(.*)(\\)|%29)" 1;
    "~*(php)([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})" 1;
    "~*(e|%65)(v|%76)(a|%61)(l|%6c)(.*)(\\(|%28)(.*)(\\)|%29)" 1;

    # Rule 6 — CGI/inurl/mod/path injection, iframe, embed tags
    "~*(/|%2f)(=|%3d|_mm|cgi(\\.|-)|inurl(:|%3a)(/|%2f)|(mod|path)(=|%3d)(\\.|%2e))" 1;
    "~*(<|%3c)(.*)(e|%65)(m|%6d)(b|%62)(e|%65)(d|%64)(.*)(>|%3e)" 1;
    "~*(<|%3c)(.*)(i|%69)(f|%66)(r|%72)(a|%61)(m|%6d)(e|%65)(.*)(>|%3e)" 1;

    # Rule 7 — object and script tag injection
    "~*(<|%3c)(.*)(o|%4f)(b|%62)(j|%4a)(e|%65)(c|%63)(t|%74)(.*)(>|%3e)" 1;
    "~*(<|%3c)(.*)(s|%73)(c|%63)(r|%72)(i|%69)(p|%70)(t|%74)(.*)(>|%3e)" 1;

    # Rule 8 — encoded DELETE and INSERT
    "~*(\\+|%2b|%20)(d|%64)(e|%65)(l|%6c)(e|%65)(t|%74)(e|%65)(\\+|%2b|%20)" 1;
    "~*(\\+|%2b|%20)(i|%69)(n|%6e)(s|%73)(e|%65)(r|%72)(t|%74)(\\+|%2b|%20)" 1;

    # Rule 9 — encoded SELECT and UPDATE
    "~*(\\+|%2b|%20)(s|%73)(e|%65)(l|%6c)(e|%65)(c|%63)(t|%74)(\\+|%2b|%20)" 1;
    "~*(\\+|%2b|%20)(u|%75)(p|%70)(d|%64)(a|%61)(t|%74)(e|%65)(\\+|%2b|%20)" 1;

    # Rule 10 — null byte, 0=0, cast(0x, or 1=1, globals array injection
    "~*(\\x00|0(=|%3d)0|cast(\\(|%28)0x|or%201(=|%3d)1)" 1;
    "~*(g|%67)(l|%6c)(o|%6f)(b|%62)(a|%61)(l|%6c)(s|%73)(=|\\[|%[0-9A-Z]{0,2})" 1;

    # Rule 11 — _request injection, javascript: with semicolons
    "~*(_|%5f)(r|%72)(e|%65)(q|%71)(u|%75)(e|%65)(s|%73)(t|%74)(=|\\[|%[0-9A-Z]{2,})" 1;
    "~*(j|%6a)(a|%61)(v|%76)(a|%61)(s|%73)(c|%63)(r|%72)(i|%69)(p|%70)(t|%74)(:|%3a)(.*)(;|%3b|\\)|%29)" 1;

    # Rule 12 — base64_encode/decode call pattern
    "~*(b|%62)(a|%61)(s|%73)(e|%65)(6|%36)(4|%34)(_|%5f)(e|%65|d|%64)(.*)(\\()(.*)(\\))" 1;

    # Rule 13 — PHP file/shell/function injection keywords
    "~*(@copy|\\$_(files|get|post)|allow_url_(fopen|include)|auto_prepend_file|browsersploit|call_user_func_array|(php|web)shell|curl(_exec|test)|disable_functions?|document_root)" 1;

    # Rule 14 — RCE function names
    "~*(elastix|encodeuricom|exploit|fclose|fgets|file_put_contents|fputs|fsbuff|fsockopen|gethostbyname|grablogin|hmei7|input_file|invokefunction|load_file|open_basedir|outfile|p3dlite)" 1;

    # Rule 15 — more RCE and shell keywords
    "~*(passthru|phpinfo|phpshells|popen|proc_open|quickbrute|remoteview|root_path|safe_mode|shell_exec|site..copier|sp_executesql|sux0r|trojan|udtudt|user_func_array|wget|wp_insert_user|xertive)" 1;

    # Rule 16 — SQL injection with separator characters
    "~*(;|<|>|\\'|\"|\\)|%0a|%0d|%22|%27|%3c|%3e|%00)(.*)(alter|base64|benchmark|cast|concat|convert|create|declare|delay|delete|drop|hex|insert|load|md5|replace|script|select|sleep|truncate|unhex|update)" 1;

    # Rule 17 — UNION SELECT, CONCAT, EVAL combinations
    "~*((\\+|%2b)(concat|delete|get|select|union)(\\+|%2b))" 1;
    "~*(union)(.*)(select)(.*)(\\(|%28)" 1;
    "~*(concat|eval)(.*)(\\(|%28)" 1;
}

# ----------------------------------------------------------------------
# 6b. BAD REQUEST URIs — 8G:[REQUEST URI]
# 23 original if-blocks translated to map entries.
# Covers: path traversal, shells, sensitive files, scanners, admin tools,
#         backup archives, dangerous extensions, encoded attacks, known
#         exploit tool names.
# ----------------------------------------------------------------------
map $request_uri $spx_bad_uri {
    default 0;

    # Rule 1 — special chars, long strings, PHP(num), header injection in URI
    "~*(,,,)|(-------)" 1;
    "~*(\\^|`|<|>|\\\\)" 1;
    "~*[a-z0-9]{2000,}" 1;
    "~*(=?\\\\(\\'|%27)/?)(\\.)|(/)(\"|'|\\.|,|&)/?$" 1;
    "~*(\\.)(php)(\\()?([0-9]+)(\\))?(/)?$" 1;
    "~*/((.*)header:|(.*)set-cookie:(.*)=)" 1;

    # Rule 2 — FTP config, FCKeditor, force-download, null-like patterns
    "~*(\\.(s?ftp-?)config|(s?ftp-?)config\\.)" 1;
    "~*(/)(f?ckfinder|fck/|fckeditor|fullclick)" 1;
    "~*(/)((force-)?download|framework/main)(\\.php)" 1;
    "~*(\\{0\\}|\"?0\"?=\"?0|\\(/\\(|\\.\\.\\.|\\+\\+\\+|\\\\\")" 1;

    # Rule 3 — forum software, WordPress functions, triple slashes, null bytes
    "~*(/)((vbull(etin)?|boards|vbforum|vbweb|webvb)(/))" 1;
    "~*((\\.|20)(get|the)(_)(permalink|posts_page_url)(\\())" 1;
    "~*(///|\\?\\?|/&&|/\\*(.*)\\*/|/:/|\\\\\\\\|0x00|%00|%0d%0a)" 1;

    # Rule 4 — alfa shell, timthumb, admin panel PHP paths
    "~*((/)(cgi_?)?alfa(_?cgiapi|_?data|_?v[0-9]+)?(\\.php))" 1;
    "~*(thumbs?(_editor|open)?|tim(thumbs?)?)((\\.php))" 1;
    "~*((/)((boot)?_?admin(er|istrator|s)(_events)?)(\\.php))" 1;

    # Rule 5 — tilde paths, backup archives, shell filenames
    "~*(/%7e)(root|ftp|bin|nobody|named|guest|logs|sshd)(/)" 1;
    "~*(archive|backup|db|master|sql|wp|www|wwwroot)\\.(gz|zip)" 1;
    "~*(/)(\\.?mad|alpha|c99|php|web)?sh(3|e)ll([0-9]+|\\w)(\\.php)" 1;

    # Rule 6 — admin upload paths, etc/var secret paths, ftp:// patterns
    "~*((/)(admin-?|file-?)(upload)(bg|_?file|ify|svu|ye)?(\\.php))" 1;
    "~*((/)(etc|var)(/)(hidden|secret|shadow|ninja|passwd|tmp)(/)?$)" 1;
    "~*((s)?(ftp|http|inurl|php)(s)?(:(/|%2f|%u2215)(/|%2f|%u2215)))" 1;

    # Rule 7 — sensitive dotfiles, system binaries
    "~*(\\.)(ds_store|htaccess|htpasswd|init?|mysql-select-db)(/)?$" 1;
    "~*(/)(bin)(/)(cc|chmod|chsh|cpp|echo|id|kill|mail|nasm|perl|ping|ps|python|tclsh)(/)?$" 1;

    # Rule 8 — localhost, makefile, pingserver, known staging paths
    "~*(/)(::[0-9999]|%3a%3a[0-9999]|127\\.0\\.0\\.1|ccx|localhost|makefile|pingserver|wwwroot)(/)" 1;
    "~*^(/)(123|backup|bak|beta|bkp|default|demo|dev(new|old)?|new-?site|null|old|old_files|old1)(/)?$" 1;

    # Rule 9 — javascript: in URI, old site staging paths
    "~*(/)?j(\\s*)?a(\\s*)?v(\\s*)?a(\\s*)?s(\\s*)?c(\\s*)?r(\\s*)?i(\\s*)?p(\\s*)?t(\\s*)?(%3a|:)" 1;
    "~*^(/)(old-?site(back)?|old(web)?site(here)?|sites?|staging|undefined|wordpress([0-9]+)|wordpress-old)(/)?$" 1;

    # Rule 10 — system directories, eval/null/open_basedir in URI
    "~*((/)(filemanager|htdocs|httpdocs|https?|mailman|mailto|msoffice|undefined|var|vhosts|webmaster|www)(/))" 1;
    "~*(\\(null\\)|\\{\\$itemURL\\}|cast\\(0x|etc/passwd|eval\\(|null(.*)null|open_basedir|self/environ|\\+union\\+all\\+select)" 1;

    # Rule 11 — config file paths, known attack directories
    "~*((/)(db-?|j-?|my(sql)?-?|setup-?|web-?|wp-?)?(admin-?)?(setup-?)?(conf\\b|conf(ig)?)(uration)?(\\.?bak|\\.inc)?(\\.inc|\\.old|\\.php|\\.txt))" 1;
    "~*((/)((.*)crlf-?injection|(.*)xss-?protection|__(inc|jsc)|author-panel|cgi-bin|database|downloader|(db|mysql)-?admin)(/))" 1;

    # Rule 12 — known malicious PHP filenames set 1
    "~*((/)(haders|head|hello|helpear|incahe|includes?|indo(sec)?|infos?|ioptimizes?|jmail|js|king|kiss|kodox|kro|legion|libsoft)(\\.php))" 1;
    "~*((/)(awstats|document_root|dologin\\.action|htaccess\\.|lib/php|listinfo|phpunit/php|remoteview|server/php|www\\.root\\.))" 1;

    # Rule 13 — PHP function calls in URI
    "~*(base64_(en|de)code|benchmark|curl_exec|echr|eval|function|fwrite|(f|p)open|html|leak|passthru|p?fsockopen|phpinfo)(.*)(\\(|%28)(.*)(\\)|%29)" 1;
    "~*(posix_(kill|mkfifo|setpgid|setsid|setuid)|(child|proc)_(close|get_status|nice|open|terminate)|(shell_)?exec|system)(.*)(\\(|%28)(.*)(\\)|%29)" 1;

    # Rule 14 — known malicious PHP filenames set 2
    "~*(/)((c99|php|web)?shell|crossdomain|fileditor|locus7|nstview|php(get|remoteview|writer)|r57|remview|sshphp|storm7|webadmin)(.*)(\\.|%2e|\\(|%28)" 1;
    "~*(/)(logo_img|lufix|mage|marg|mass|mide|moon|mssqli|mybak|myshe|mysql|mytag_js?|nasgor|newfile|news|nf_?tracking|nginx|ngoi|ohayo|old-?index)(\\.php)" 1;

    # Rule 15 — known malicious PHP filenames set 3
    "~*(/)(olux|owl|pekok|petx|php-?info|phpping|popup-pomo|priv|r3x|radio|rahma|randominit|readindex|readmy|reads|repair-?bak|root)(\\.php)" 1;
    "~*(/)(router|savepng|semayan|shell|shootme|sky|sql(bak|_?dump)?|support|sym403|sys|system_log|test|tmp-?(uploads)?)(\\.php)" 1;

    # Rule 16 — known malicious PHP filenames set 4
    "~*(/)(traffic-advice|u2p|udd|ukauka|up__uzegp|up14|upa?|upxx?|vega|vip|vu(ln)?(\\w)?|webroot|weki|wikindex|wordpress|wp_logns?|wp_wrong_datlib)(\\.php)" 1;
    "~*(/)(wp-?install|installation|wp(3|4|5|6)|wpfootes|wpzip|ws0|wsdl|wso(\\w)?|www|(uploads|wp-admin)?xleet(-shell)?|xmlsrpc|xup|xxu|xxx|zibi|zipy)(\\.php)" 1;

    # Rule 17 — known attack tool names in URI set 1
    "~*(bkv74|cachedsimilar|core-stab|crgrvnkb|ctivrc|deadcode|deathshop|dkiz|e7xue|eqxafaj90zir|exploits|ffmkpcal|filellli7|(fox|sid)wso|gel4y|gvqqpinc)" 1;

    # Rule 18 — known attack tool names in URI set 2
    "~*(@md5|00.temp00|0byte|0d4y|0day|0xor|wso1337|1h6j5|3xp|40dd1d|4price|70bex?|a57bze893|abbrevsprl|abruzi|adminer|aqbmkwwx|archivarix|backdoor|beez5|bgvzc29)" 1;

    # Rule 19 — known attack tool names in URI set 3
    "~*(handler_to_code|hax(0|o)r|hmei7|hnap1|home_url=|ibqyiove|icxbsx|indoxploi|jahat|jijle3|kcrew|keywordspy|laobiao|lock360|longdog|marijuan|mod_(aratic|ariimag))" 1;

    # Rule 20 — known attack tool names in URI set 4
    "~*(mobiquo|muiebl|nessus|osbxamip|phpunit|priv8|qcmpecgy|r3vn330|racrew|raiz0|reportserver|r00t|respectmus|rom2823|roseleif|sh3ll|site..copier|sqlpatch|sux0r)" 1;

    # Rule 21 — known attack tool names in URI set 5
    "~*(sym403|telerik|uddatasql|utchiha|visualfrontend|w0rm|wangdafa|wpyii2|wsoyanzo|x5cv|xattack|xbaner|xertive|xiaolei|xltavrat|xorz|xsamxad|xsvip|xxxs?s?|zabbix|zebda)" 1;

    # Rule 22 — dangerous file extensions in URI set 1
    "~*(\\.)(7z|ab4|ace|afm|alfa|as(h|m)x?|aspx?|aws|axd|bash|ba?k?|bat|bz2|cfg|cfml?|cgi|cms|conf\\b|config|ctl|dat|db|dist|dll|eml|eng(ine)?|env|et2|exe|fec|fla|git(ignore)?)$" 1;
    "~*(\\.)(hg|idea|inc|index|ini|inv|jar|jspa?|lib|local|log|lqd|make|mbf|mdb|mmw|mny|mod(ule)?|msi|old|one|orig|out|passwd|pdb|php\\.php|phtml?|pl|profiles?)$" 1;

    # Rule 23 — dangerous file extensions in URI set 2
    "~*(\\.)(psd|pst|ptdb|production|pwd|py|qbb|qdf|rar|rdf|remote|save|sdb|sql|sh|soa|svn|swf|swl|swo|swp|stx|tar|tax|tgz?|theme|tls|tmb|tmd|wok|wow|xsd|xtmpl|xz|ya?ml|za|zlib)$" 1;
}

# ----------------------------------------------------------------------
# 6c. BAD USER AGENTS — 8G:[USER AGENT]
# 12 original if-blocks translated to map entries.
# Covers: scanners, scrapers, exploit tools, bad bots, shell UAs,
#         encoded payloads in UA string, legacy browser fingerprints.
# ----------------------------------------------------------------------

# Empty UA policy: block by default, allow only listed IPs.
# TUS clients, health probes, and monitoring tools with no UA must be
# added here by egress IP. [SPX]
map $spx_real_ip $spx_empty_ua_is_bad {
    default   1;   # empty UA is BAD unless allowlisted
    127.0.0.1 0;
    ::1       0;
    # 203.0.113.45 0;  # TODO: add monitor/VPN egress IP(s)
}

map $http_user_agent $spx_bad_bot {
    default 0;

    # Rule 1 — long UA strings, encoded characters
    "~*[a-z0-9]{2000,}" 1;
    "~*(&lt;|%0a|%0d|%27|%3c|%3e|%00|0x00)" 1;

    # Rule 2 — shell UAs, base64, eval, unserialize
    "~*(oppo\\sa33|(c99|php|web)shell|site..copier)" 1;
    "~*(base64_decode|bin/bash|disconnect|eval|unserializ)" 1;

    # Rule 3 — bad bots A-C
    "~*(acapbot|acoonbot|alexibot|antbot|asterias|attackbot|awario|babbar|backdor|barkrowler|becomebot|binlar|bitsightbot|blackwidow|blekkobot|blex|blowfish|bullseye|bunnys|butterfly|bytespider|careerbot|casper|censysinspect)" 1;

    # Rule 4 — bad bots C-D
    "~*(checkpriv|cheesebot|cherrypick|chinaclaw|choppy|claudebot|clshttp|cmsworld|commoncrawl|copernic|copyrightcheck|cosmos|crawlergo|crescent|criteo|datacha|dataforseo|(\\b)demon(\\b)|diavol|discobot|dittospyder)" 1;

    # Rule 5 — bad bots D-F
    "~*(dotbot|dotnetdotcom|dumbot|econtext|emailcollector|emailsiphon|emailwolf|eolasbot|eventures|extract|eyenetie|feedfinder|flaming|flashget|flicky|foobot|fuck)" 1;

    # Rule 6 — bad bots G-L
    "~*(g00g1e|getright|gigabot|go-ahead-got|go-http-client|gozilla|grabnet|grafula|harvest|heritrix|hrankbot|httracks?|icarus6j|imagesiftbot|intelx|jetbot|jetcar|jikespider|kmccrew|leechftp|libweb|liebaofast)" 1;

    # Rule 7 — bad bots L-N
    "~*(linkscan|linkwalker|lwp-download|majestic|masscan|mauibot|miner|mechanize|mj12bot|morfeus|moveoverbot|mozlila|netmechanic|netspider|nicerspro|nikto|ninja|nominet|nutch)" 1;

    # Rule 8 — bad bots O-S
    "~*(octopus|pagegrabber|petalbot|planetwork|postrank|proximic|purebot|queryn|queryseeker|radian6|radiation|realdownload|remoteview|rogerbot|scan|scooter|scrapy|seekerspid)" 1;

    # Rule 9 — bad bots S
    "~*(semalt|seokicks|seznambot|siclab|sindice|sistrix|sitebot|siteexplorer|sitesnagger|skygrid|smartdownload|snoopy|sosospider|spankbot|spbot|sqlmap|stackrambler|stripper|sucker|surftbot)" 1;

    # Rule 10 — bad bots S-V
    "~*(sux0r|suzukacz|suzuran|takeout|teleport|telesoft|true_robots|turingos|turnit|tweetmemebot|vampire|vikspider|voideye|webleacher|webreaper|webstripper|webvac|webviewer|webwhacker|wellknownbot)" 1;

    # Rule 11 — bad bots W-Z
    "~*(winhttp|wwwoffle|woxbot|xaldon|xxxyy|yamanalab|yioopbot|yisouspider|youda|zeus|zmeu|zoominfobot|zune|zyborg)" 1;

    # Rule 12 — curl scanning / libwww-perl / pycurl (safe curl allowed)
    "~*(curl.*(scan|exploit)|libwww-perl|pycurl)" 1;

    # [SPX] Additional modern scanners not in original 8G
    "~*(360Spider|80legs|Abonti|Acunetix|AhrefsBot|BackDoor|Baiduspider|Censys|CPython|DirBuster|DotBot|Ezooms|FHscan|Heritrix|HTTrack|LieBaoFast|LinkpadBot|MegaIndex|MJ12bot|Nmap|OpenVAS|Semalt|Wget|Xenu|Zgrab)" 1;

    # Empty UA — conditional on IP allowlist
    "" $spx_empty_ua_is_bad;
}

# ----------------------------------------------------------------------
# 6d. BAD REFERRERS — 8G:[HTTP REFERRER]
# Covers: SQL injection in referrer, shell markers, pharma/spam domains,
#         SEO injection keywords.
# ----------------------------------------------------------------------
map $http_referer $spx_bad_referer {
    default 0;

    # SQL injection in referrer
    "~*(order(\\s|%20)by(\\s|%20)1--)" 1;

    # Shell and exploit markers in referrer
    "~*(@unlink|assert\\(|print_r\\(|\\x00|%00|xbshell)" 1;

    # Pharma / spam / SEO injection keywords — set 1
    "~*(100dollars|best-seo|blue\\spill|cocaine|ejaculat|erectile|erections|hoodia|huronriveracres|impotence|levitra|libido|lipitor|mopub\\.com|phentermin)" 1;

    # Pharma / spam / SEO injection keywords — set 2
    "~*(pornhelm|pro[sz]ac|sandyauer|semalt\\.com|social-buttions|todaperfeita|tramadol|troyhamby|ultram|unicauca|valium|viagra|vicodin|xanax|ypxaieo)" 1;
}

# ----------------------------------------------------------------------
# 6e. BAD HTTP METHODS — 8G:[REQUEST METHOD]
# Covers: dangerous/unused methods that signal scanners or exploit tools.
# Note: DELETE, PATCH, PUT are NOT blocked — REST APIs require them.
# ----------------------------------------------------------------------
map $request_method $spx_bad_method {
    default 0;
    "~*(connect|debug|move|trace|track)" 1;
}

# ----------------------------------------------------------------------
# 6f. BAD COOKIES — 8G:[HTTP COOKIE]
# Covers: encoded injection characters in cookie values.
# ----------------------------------------------------------------------
map $http_cookie $spx_bad_cookie {
    default 0;
    "~*(<|>|\\'|%0A|%0D|%27|%00)" 1;
}

# ======================================================================
# 7. BEHAVIORAL MAPS [SPX]
# SPARXSTAR additions — not present in original 8G.
# ======================================================================

# Strict POST Content-Type Validation
# Blocks POST requests with no recognisable Content-Type — common in
# automated scanners and raw-socket exploit tools.
map "$request_method:$http_content_type" $spx_bad_post {
    default 0;
    "~^POST:(?!.*(application/x-www-form-urlencoded|multipart/form-data|application/json|text/xml|application/xml))" 1;
}

# Fake Trackbacks
# Legitimate trackback pings use automation UAs, not browsers.
# A browser UA on /trackback/ is a spam bot.
map "$request_uri:$http_user_agent" $spx_fake_trackback {
    default 0;
    "~*/trackback/.*:(Mozilla|Opera|Firefox|Chrome|Safari)" 1;
}

# Comment Spam — POST to wp-comments-post.php with no Referer header.
# Legitimate comment submissions always carry a Referer (the post page).
map "$request_method:$request_uri:$http_referer" $spx_comment_spam {
    default 0;
    "~^POST:.*wp-comments-post\\.php:$" 1;
}

# Bogus Graphics Exploit — Content-Disposition carrying a .php filename.
# Attacker tricks the server into executing an image as PHP.
map $http_content_disposition $spx_bad_content_disposition {
    default 0;
    "~*\\.php" 1;
}

# Missing Host Header — HTTP/1.1 requires Host; its absence signals a
# scanner, raw-socket probe, or request-smuggling attempt.
map $http_host $spx_missing_host {
    default 0;
    "" 1;
}

# ======================================================================
# 8. THE EVENT HORIZON — THREAT AGGREGATION [SPX]
# ======================================================================

# Step 8a — base threat: any non-geo threat vector fires → result is 1.
# Now includes $spx_bad_method and $spx_bad_cookie (restored from 8G).
map "$spx_bad_query:$spx_bad_uri:$spx_bad_bot:$spx_bad_referer:$spx_bad_method:$spx_bad_cookie:$spx_bad_post:$spx_fake_trackback:$spx_comment_spam:$spx_bad_content_disposition:$spx_missing_host" $spx_base_threat {
    default 0;
    "~1" 1;
}

# Step 8b — geo amplifier: fires only when BOTH high-risk country AND a
# base-threat signal are present. Geo alone never triggers a block.
#   $spx_high_risk_geo=1, $spx_base_threat=0  → 0  (geo alone: no block)
#   $spx_high_risk_geo=0, $spx_base_threat=1  → 0  (base threat blocks in 8c)
#   $spx_high_risk_geo=1, $spx_base_threat=1  → 1  (amplified block)
map "$spx_high_risk_geo:$spx_base_threat" $spx_geo_amplified {
    default 0;
    "1:1"   1;
}

# Step 8c — final aggregation: block when base threat fires OR when the
# geo amplifier fires (both geo AND another signal required).
map "$spx_base_threat:$spx_geo_amplified" $spx_threat_detected {
    default 0;
    "~1" 1;
}

# ======================================================================
# 9. FINAL DECISION MATRIX [SPX]
# ----------------------------------------------------------------------
# Combines threat status with firewall activation into a single binary.
# 1:1 = Firewall ON + Threat FOUND  → Block (1)
# 1:0 = Firewall ON + No Threat     → Pass  (0)
# 0:1 = Firewall OFF + Threat FOUND → Pass  (0) [bypass active]
# 0:0 = Firewall OFF + No Threat    → Pass  (0)
#
# Operator usage in server{} or location{} blocks:
#   if ($spx_final_decision) { return 444; }
# ======================================================================
map "$spx_firewall_active:$spx_threat_detected" $spx_final_decision {
    default 0;
    "1:1"   1;
}

# ======================================================================
# 10. SPARXSTAR WORKER TRUST INFRASTRUCTURE [SPX]
# ----------------------------------------------------------------------
# Allows Cloudflare Workers to pass trusted SPARXSTAR claim headers
# through the Nginx perimeter. The shared secret is stored in a separate
# file so it is never committed to this repository.
#
# Deployment: create /etc/nginx/secrets/worker-secret.conf with one line:
#   "your-shared-secret-value" 1;
# Then reload Nginx. Never commit the secret value.
# ======================================================================

# Step 1: verify the shared worker secret from the request header.
map $http_x_worker_origin_secret $spx_worker_secret_ok {
    default 0;
    include /etc/nginx/secrets/worker-secret.conf;
}

# Step 2: only trust workers when the request is from Cloudflare AND
# the secret is correct. Both conditions must be true.
map "$spx_from_cloudflare:$spx_worker_secret_ok" $spx_is_trusted_worker {
    default 0;
    "1:1"   1;
}

# Conditional SPARXSTAR header forwarding — empty string by default
# (strips spoofed headers from untrusted clients). Preserved only for
# verified Cloudflare Worker requests ($spx_is_trusted_worker = 1).
map $spx_is_trusted_worker $spx_pass_sparxstar_user      { default ""; 1 $http_x_sparxstar_user; }
map $spx_is_trusted_worker $spx_pass_sparxstar_session   { default ""; 1 $http_x_sparxstar_session; }
map $spx_is_trusted_worker $spx_pass_sparxstar_roles     { default ""; 1 $http_x_sparxstar_roles; }
map $spx_is_trusted_worker $spx_pass_sparxstar_issued    { default ""; 1 $http_x_sparxstar_issued; }
map $spx_is_trusted_worker $spx_pass_sparxstar_expires   { default ""; 1 $http_x_sparxstar_expires; }
map $spx_is_trusted_worker $spx_pass_sparxstar_site      { default ""; 1 $http_x_sparxstar_site; }
map $spx_is_trusted_worker $spx_pass_sparxstar_authlevel { default ""; 1 $http_x_sparxstar_authlevel; }

# ======================================================================
# 11. THREAT SIGNAL PROPAGATION [SPX]
# ----------------------------------------------------------------------
# Variables consumed by proxy_set_header in spx-dynamic-proxy-headers.conf
# to annotate each proxied request with threat intelligence for PHP
# consumers (Helios / Sirus). Values are always derived from server-computed
# map variables — any client-supplied X-SPX-* header is overwritten.
# ======================================================================

# 11a. REASON FLAGS
# Each map produces "" (signal off) or a labelled fragment with a trailing
# "|" delimiter (signal on). X-SPX-Reason is the concatenation of all
# active fragments. PHP consumer:
#   $reason = rtrim($_SERVER['HTTP_X_SPX_REASON'] ?? '', '|');
map $spx_bad_query               $spx_rflag_sqli   { default ""; 1 "sqli|"; }
map $spx_bad_uri                 $spx_rflag_uri    { default ""; 1 "bad_uri|"; }
map $spx_bad_bot                 $spx_rflag_bot    { default ""; 1 "bot|"; }
map $spx_bad_referer             $spx_rflag_ref    { default ""; 1 "bad_ref|"; }
map $spx_bad_method              $spx_rflag_method { default ""; 1 "bad_method|"; }
map $spx_bad_cookie              $spx_rflag_cookie { default ""; 1 "bad_cookie|"; }
map $spx_bad_post                $spx_rflag_post   { default ""; 1 "bad_post|"; }
map $spx_bad_content_disposition $spx_rflag_cd     { default ""; 1 "content_disp|"; }
map $spx_missing_host            $spx_rflag_host   { default ""; 1 "missing_host|"; }
map $spx_high_risk_geo           $spx_rflag_geo    { default ""; 1 "geo_risk|"; }

# 11b. RISK SCORE (0–100 numeric tier for downstream triage)
# Key: "$spx_bad_query:$spx_bad_content_disposition:$spx_geo_amplified:$spx_base_threat"
# All four variables are binary (0|1). PCRE; first matching entry wins.
map "$spx_bad_query:$spx_bad_content_disposition:$spx_geo_amplified:$spx_base_threat" $spx_risk_score {
    default       0;
    "~^1:1:"     96;  # SQLi + PHP Content-Disposition exploit — critical
    "~^1:.:1:"   92;  # SQLi + geo amplified — critical
    "~^.:1:1:"   90;  # PHP Content-Disposition exploit + geo amplified — critical
    "~^1:0:0:"   78;  # SQLi/XSS/RCE only — high
    "~^0:1:0:"   80;  # Content-Disposition .php exploit only — high
    "~^0:0:1:1$" 68;  # Geo amplified with other base threat — medium-high
    "~^0:0:0:1$" 48;  # Other base threat only (bot, bad URI, etc.) — medium
}
