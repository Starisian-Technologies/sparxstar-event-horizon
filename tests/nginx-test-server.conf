# SPARXSTAR Event Horizon — CI Test Server / Operator Reference Config
# Used by .github/workflows/quality.yml for nginx syntax and attack tests.
#
# This file serves a dual purpose:
#   1. CI harness — provides upstream stubs and a working nginx server for
#      the attack simulation tests in tests/test_firewall.py.
#   2. Operator reference — shows the complete pattern for integrating
#      spx-horizon-rules.conf into a real server block, including:
#        • how to include the firewall snippet (pure blocking only)
#        • how to add proxy_pass and rate limits in operator locations
#        • how to include spx-firewall-gate.conf in each proxied location
#        • how to include spx-dynamic-proxy-headers.conf for X-SPX-* propagation
#
# For production, replace 127.0.0.1:6081 / 127.0.0.1:1080 with your
# actual backend addresses, and adjust rate-limit burst values.
# ======================================================================

upstream varnish_backend {
    server 127.0.0.1:6081;  # CI stub — replace with your application backend
    keepalive 32;
}

upstream tus_node_backend {
    server 127.0.0.1:1080;  # CI stub — replace with your TUS upload backend
    keepalive 8;
}

server {
    listen 80 default_server;
    server_name localhost;
    root /var/www/html;
    index index.html;

    # Standard proxy headers — inherit into all location blocks that do
    # not define their own proxy_set_header (Nginx drops server-level
    # proxy_set_header for any location that defines at least one).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header X-Request-ID      $request_id;
    proxy_set_header Connection        "";
    proxy_http_version 1.1;

    # ── Cloudflare RealIP trust (http context include) ────────────────
    include /etc/nginx/conf.d/spx-cloudflare-trust.conf;

    # ── Firewall rules (pure blocking only) ──────────────────────────
    # This include provides:
    #   • access_log for blocked traffic
    #   • security response headers (spx-security-headers.conf)
    #   • honeypot (/spx-trap), dot-dir lock, upload lockdown,
    #     sensitive file lockdown, xmlrpc block
    #   • static asset bypass (spx-static-assets-runtime.conf hook)
    #   • health check (/health → 200 for bypass-listed IPs)
    # It does NOT define proxy_pass, rate limits, or location blocks
    # for paths that need upstream proxying.
    include /etc/nginx/snippets/spx-horizon-rules.conf;

    # ── Operator runtime locations ────────────────────────────────────
    # Each proxied location:
    #   1. Includes spx-firewall-gate.conf — ghosts the request if any
    #      threat signal is active ($spx_final_decision = 1).
    #   2. Enforces rate limits appropriate for that path.
    #   3. Includes spx-dynamic-proxy-headers.conf — injects X-SPX-*
    #      threat signals and X-SPARXSTAR-* identity headers for PHP.
    #   4. Sets proxy_pass to the appropriate upstream.

    # CI test: header echo — reflects received proxy headers back as
    # response headers so test_firewall.py can verify propagation.
    location = /echo-headers {
        include /etc/nginx/snippets/spx-firewall-gate.conf;
        include /etc/nginx/snippets/spx-dynamic-proxy-headers.conf;
        proxy_pass http://varnish_backend;
    }

    # ACME challenge and well-known pass-through.
    # ^~ wins over the extension-based lockdown regex in the firewall.
    location ^~ /.well-known/ {
        proxy_pass http://varnish_backend;
    }

    # WordPress login — tighter rate limit.
    location = /wp-login.php {
        include /etc/nginx/snippets/spx-firewall-gate.conf;
        limit_req zone=spx_wp_login burst=3 nodelay;
        include /etc/nginx/snippets/spx-dynamic-proxy-headers.conf;
        proxy_pass http://varnish_backend;
    }

    # WordPress admin.
    location /wp-admin/ {
        include /etc/nginx/snippets/spx-firewall-gate.conf;
        limit_req zone=spx_general burst=20 nodelay;
        include /etc/nginx/snippets/spx-dynamic-proxy-headers.conf;
        proxy_pass http://varnish_backend;
    }

    # GraphQL — POST and OPTIONS only. GET queries expose parameters in
    # logs and caches.
    location /graphql {
        include /etc/nginx/snippets/spx-firewall-gate.conf;
        if ($request_method !~ ^(POST|OPTIONS)$) { return 444; }
        limit_req zone=spx_graphql burst=10 nodelay;
        include /etc/nginx/snippets/spx-dynamic-proxy-headers.conf;
        proxy_pass http://varnish_backend;
    }

    # Submission endpoint.
    location /submission {
        include /etc/nginx/snippets/spx-firewall-gate.conf;
        limit_req zone=spx_submission burst=10 nodelay;
        include /etc/nginx/snippets/spx-dynamic-proxy-headers.conf;
        proxy_pass http://varnish_backend;
    }

    # TUS resumable uploads. TUS clients (mobile recorders, upload SDKs)
    # often send no User-Agent per spec §1.5 — add their egress IPs to
    # the $spx_empty_ua_is_bad allowlist so they are not ghosted.
    location /files/ {
        include /etc/nginx/snippets/spx-firewall-gate.conf;
        proxy_set_header Tus-Resumable   $http_tus_resumable;
        proxy_set_header Upload-Offset   $http_upload_offset;
        proxy_set_header Upload-Length   $http_upload_length;
        proxy_set_header Upload-Metadata $http_upload_metadata;
        proxy_pass http://tus_node_backend;
    }

    # Main application catch-all. Enforce method guard, then firewall
    # gate, then proxy clean traffic to the application backend.
    location / {
        include /etc/nginx/snippets/spx-firewall-gate.conf;
        if ($request_method !~ ^(GET|POST|HEAD|PUT|PATCH|DELETE|OPTIONS)$) { return 444; }
        if ($request_method = OPTIONS) { return 204; }
        limit_conn spx_conn 50;
        limit_req  zone=spx_req burst=40 nodelay;
        include /etc/nginx/snippets/spx-dynamic-proxy-headers.conf;
        proxy_pass http://varnish_backend;
    }
}

# CI stub backend — simulates Varnish/Apache by serving files from disk
# and echoing received proxy headers back as response headers.
server {
    listen 6081;
    server_name localhost;
    root /var/www/html;

    location = /echo-headers {
        add_header X-SPX-Threat-Echo        $http_x_spx_threat        always;
        add_header X-SPX-Risk-Echo          $http_x_spx_risk          always;
        add_header X-SPX-Geo-Risk-Echo      $http_x_spx_geo_risk      always;
        add_header X-SPX-Bot-Echo           $http_x_spx_bot           always;
        add_header X-SPX-Reason-Echo        $http_x_spx_reason        always;
        add_header X-SPARXSTAR-User-Echo    $http_x_sparxstar_user    always;
        add_header X-SPARXSTAR-Session-Echo $http_x_sparxstar_session always;
        add_header X-SPARXSTAR-Roles-Echo   $http_x_sparxstar_roles   always;
        add_header X-SPARXSTAR-AuthLevel-Echo $http_x_sparxstar_authlevel always;
        return 200 "headers_echo";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# CI stub TUS backend — simulates the Node TUS ingestion server.
server {
    listen 1080;
    server_name localhost;
    location /files/ {
        return 200 "TUS stub OK";
    }
}
