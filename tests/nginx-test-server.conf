upstream varnish_backend {
    server 127.0.0.1:6081;  # CI stub backend
    keepalive 32;
}

upstream tus_node_backend {
    server 127.0.0.1:1080;  # CI stub TUS backend
    keepalive 8;
}

server {
    listen 80 default_server;
    server_name localhost;
    root /var/www/html;
    index index.html;

    include /etc/nginx/conf.d/spx-cloudflare-trust.conf;
    include /etc/nginx/snippets/spx-horizon-rules.conf;
    # location / is provided by spx-horizon-rules.conf
}

# CI stub backend — simulates Varnish/Apache by serving files from disk.
server {
    listen 6081;
    server_name localhost;
    root /var/www/html;

    # Header echo endpoint — reflects X-SPX-* request headers back as
    # response headers so test_firewall.py can verify propagation.
    location = /echo-headers {
        add_header X-SPX-Threat-Echo   $http_x_spx_threat   always;
        add_header X-SPX-Risk-Echo     $http_x_spx_risk     always;
        add_header X-SPX-Geo-Risk-Echo $http_x_spx_geo_risk always;
        add_header X-SPX-Bot-Echo      $http_x_spx_bot      always;
        add_header X-SPX-Reason-Echo   $http_x_spx_reason   always;
        add_header X-SPARXSTAR-User-Echo      $http_x_sparxstar_user      always;
        add_header X-SPARXSTAR-Session-Echo   $http_x_sparxstar_session   always;
        add_header X-SPARXSTAR-Roles-Echo     $http_x_sparxstar_roles     always;
        add_header X-SPARXSTAR-AuthLevel-Echo $http_x_sparxstar_authlevel always;
        return 200 "headers_echo";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# CI stub TUS backend — simulates the Node TUS ingestion server.
server {
    listen 1080;
    server_name localhost;
    location /files/ {
        return 200 "TUS stub OK";
    }
}
