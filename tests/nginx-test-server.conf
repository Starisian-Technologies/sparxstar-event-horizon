# ======================================================================
# SPARXSTAR Event Horizon — CI Test Server Configuration
# Used by .github/workflows/quality.yml for nginx syntax and attack tests.
# NOT for production. Replace proxy_pass targets and upstreams for real use.
# ======================================================================

upstream varnish_upstream {
    server 127.0.0.1:6081;  # CI stub backend
}

server {
    listen 80 default_server;
    server_name localhost;
    root /var/www/html;
    index index.html;

    include /etc/nginx/conf.d/spx-cloudflare-trust.conf;
    include /etc/nginx/snippets/spx-horizon-rules.conf;
    # location / is provided by spx-horizon-rules.conf
}

# CI stub backend — simulates Varnish/Apache by serving files from disk.
server {
    listen 6081;
    server_name localhost;
    root /var/www/html;
    location / {
        try_files $uri $uri/ =404;
    }
}
