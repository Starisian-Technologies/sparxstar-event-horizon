name: SPARXSTAR Quality Control

on:
  push:
    branches: ["main", "universe"]
  pull_request:
    branches: ["main", "universe"]

jobs:
  syntax-check:
    name: Nginx Syntax Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Nginx
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx

      - name: Validate Python Script Syntax
        run: python3 -m compileall scripts tests

      - name: Deploy SPARXSTAR Event Horizon Config
        run: |
          # 1. Copy Logic file to http context directory (000- prefix ensures it loads first)
          sudo cp nginx/conf.d/000-spx-horizon-logic.conf /etc/nginx/conf.d/

          # 2. Copy Cloudflare trust file to http context directory
          sudo cp nginx/conf.d/spx-cloudflare-trust.conf /etc/nginx/conf.d/

          # 3. Create snippets directory and copy shipped snippet files
          sudo mkdir -p /etc/nginx/snippets
          sudo cp nginx/snippets/spx-dynamic-proxy-headers.conf /etc/nginx/snippets/

          # 4. Write a minimal CI server block that references only files deployed in this job
          sudo tee /etc/nginx/sites-available/default > /dev/null <<'EOF'
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _;

              root /var/www/html;
              index index.html index.htm;

              location / {
                  try_files $uri $uri/ =404;
              }
          }
          EOF

          # Ensure the default site is enabled
          sudo ln -sf /etc/nginx/sites-available/default /etc/nginx/sites-enabled/default

          # 5. Create worker-secret stub (no real secret needed for syntax/CI tests)
          sudo mkdir -p /etc/nginx/secrets
          echo '"test-worker-secret" 1;' | sudo tee /etc/nginx/secrets/worker-secret.conf > /dev/null

          # 6. Deploy high-risk geo map (operators customise this file)
          sudo mkdir -p /etc/nginx/maps
          sudo cp nginx/maps/spx-high-risk-geo.map /etc/nginx/maps/high-risk-geo.map

      - name: Validate Nginx Syntax
        run: sudo nginx -t

  firewall-test:
    name: Attack Simulation
    runs-on: ubuntu-latest
    needs: syntax-check
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Nginx
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx

      - name: Validate Python Script Syntax
        run: python3 -m compileall scripts tests

      - name: Deploy SPARXSTAR Event Horizon Config
        run: |
          sudo cp nginx/conf.d/000-spx-horizon-logic.conf /etc/nginx/conf.d/
          sudo cp nginx/conf.d/spx-cloudflare-trust.conf /etc/nginx/conf.d/
          sudo mkdir -p /etc/nginx/snippets
          sudo cp nginx/snippets/spx-dynamic-proxy-headers.conf /etc/nginx/snippets/

          # Provide CI-only runtime rate-limit zones required by the
          # operator example server block used in this workflow.
          sudo tee /etc/nginx/conf.d/001-spx-ci-rate-limits.conf > /dev/null <<'EOF'
          limit_conn_zone $spx_real_ip zone=spx_conn:10m;
          limit_req_zone $spx_real_ip zone=spx_req:10m rate=20r/s;
          limit_req_zone $spx_real_ip zone=spx_wp_login:10m rate=5r/m;
          limit_req_zone $spx_real_ip zone=spx_graphql:10m rate=30r/m;
          limit_req_zone $spx_real_ip zone=spx_submission:10m rate=20r/m;
          limit_req_zone $spx_real_ip zone=spx_general:10m rate=300r/m;
          EOF

          sudo cp docs/operator-example-server-block.conf /etc/nginx/sites-available/default
          sudo ln -sf /etc/nginx/sites-available/default /etc/nginx/sites-enabled/default

          # Create worker-secret stub (no real secret needed for CI attack tests)
          sudo mkdir -p /etc/nginx/secrets
          echo '"test-worker-secret" 1;' | sudo tee /etc/nginx/secrets/worker-secret.conf > /dev/null

          # Deploy high-risk geo map
          sudo mkdir -p /etc/nginx/maps
          sudo cp nginx/maps/spx-high-risk-geo.map /etc/nginx/maps/high-risk-geo.map

      - name: Enable Firewall for CI Test Runner
        run: |
          # The repo config whitelists 127.0.0.1 for local admin use, but CI
          # connects from 127.0.0.1 — so the firewall would be bypassed and
          # attack tests would never see a block. Remove only the bypass entries
          # from $spx_firewall_active (identified by the spx-admin-bypass marker)
          # so other per-IP allowlists (e.g. $spx_empty_ua_is_bad) are preserved.
          sudo sed -i '/# spx-admin-bypass/d' /etc/nginx/conf.d/000-spx-horizon-logic.conf

      - name: Validate & Start Nginx
        run: |
          sudo nginx -t
          sudo systemctl restart nginx

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Test Dependencies
        run: pip install requests pytest

      - name: Run Attack Simulation Tests
        run: pytest tests/test_firewall.py -v
