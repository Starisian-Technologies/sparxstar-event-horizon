# SPARXSTAR EVENT HORIZON v2.0 — FIREWALL GATE CHECK
# Proprietary — Copyright © 2026 Starisian Technologies (Max Barrett). All Rights Reserved.
#
# Reusable firewall gate check for operator-defined location blocks.
# Include this at the top of every location block that proxies to an
# upstream. If $spx_final_decision is 1 (any active threat signal when
# the firewall is not bypassed for this IP), the connection is ghosted
# immediately — the upstream never receives the request.
#
# Usage inside your server block location:
#
#   location /wp-login.php {
#       include /etc/nginx/snippets/spx-firewall-gate.conf;
#       limit_req zone=spx_wp_login burst=3 nodelay;
#       include /etc/nginx/snippets/spx-dynamic-proxy-headers.conf;
#       proxy_pass http://your_backend;
#   }
#
# ONE CHECK RULE — METHOD GUARDS
# The architectural mandate requires all blocking logic to be aggregated
# into map variables in the http context so the server block enforces only
# a single check ($spx_final_decision). If you need to restrict a location
# to specific HTTP methods, add a map to 000-spx-horizon-logic.conf (or an
# operator-managed http-context include) and aggregate it into
# $spx_final_decision, rather than adding bare if{} blocks inside the
# location. This keeps the "one check" invariant intact and ensures every
# block decision honours the Emergency Bypass.
#
# Exception: the main catch-all location / may use a single if{} for the
# method guard and a single if{} for the OPTIONS preflight response — both
# inside the location block, not the server context, which is consistent
# with the One Check Rule (which governs server-context if blocks only).
# ======================================================================
if ($spx_final_decision) { return 444; }
