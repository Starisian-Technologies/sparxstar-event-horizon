# ======================================================================
# SPARXSTAR EVENT HORIZON v2.0 [SERVER RULES]
# MIT License — Copyright (c) 2026 Starisian Technologies
#
# FIREWALL RULES ONLY. This file deliberately contains no proxy_pass,
# no limit_req / limit_conn enforcement, and no proxy_set_header directives.
# Those are runtime concerns that belong in your server block or platform
# adapter — not in the firewall.
#
# Include this file inside your server{} block:
#   include /etc/nginx/snippets/spx-horizon-rules.conf;
#
# Then add your own runtime location blocks (proxy_pass, rate limits, etc.).
# For each location that defines its own add_header directives, also include:
#   include /etc/nginx/snippets/spx-security-headers.conf;
# to prevent Nginx from silently dropping the security headers.
#
# For threat signal propagation to upstream PHP (X-SPX-* headers), include
# snippets/spx-dynamic-proxy-headers.conf inside each proxied location.
# ======================================================================

# 1. LOGGING
# ----------------------------------------------------------------------
access_log /var/log/nginx/spx-blocked.log combined if=$spx_log_trigger;

# 2. SECURITY RESPONSE HEADERS (modular)
# ----------------------------------------------------------------------
# Applied globally to all responses from this server block.
# If any of your location blocks define their own add_header directives,
# re-include this file inside those blocks to preserve the security headers
# (Nginx does not inherit add_header from the server context in that case).
include /etc/nginx/snippets/spx-security-headers.conf;

# 3. THREAT SIGNAL PROPAGATION HEADERS
# ----------------------------------------------------------------------
# X-SPX-* headers (Threat, Risk, Geo-Risk, Bot, Reason) and X-SPARXSTAR-*
# identity headers are NOT set here — they are proxy_set_header directives
# and belong in location blocks that use proxy_pass. Include the shared
# snippet in each such location:
#   include /etc/nginx/snippets/spx-dynamic-proxy-headers.conf;
# See that file for the full PHP consumer contract (Helios / Sirus).

# 4. BOT TRAP (HONEY POT)
# ----------------------------------------------------------------------
# Add Disallow: /spx-trap in robots.txt. Any hit ghosts the connection.
location = /spx-trap {
    access_log /var/log/nginx/spx-blocked.log combined;
    return 444;
}

# 5. DOT DIRECTORY TRAVERSAL LOCK
# ----------------------------------------------------------------------
# Block .git/, .svn/, .hg/ directory paths.
# The extension lock below catches files ending in .git; this location
# is needed to block directory traversal like /.git/config.
location ~* /\.(git|svn|hg)/ {
    return 444;
}

# 6. STATIC ASSET BYPASS (Performance)
# ----------------------------------------------------------------------
# Suppresses access/not-found logging on high-volume static traffic.
# Nginx's location matching selects this regex location over the prefix
# location / below, so static asset requests never reach the firewall
# gate check (if $spx_final_decision) inside location /. This is the
# intentional bypass — no threat map variables are evaluated for images,
# fonts, or stylesheets.
# IMPORTANT: because this regex location wins over the catch-all location /,
# matching requests must be handled from inside this block. Populate the
# runtime include below with proxy_pass, try_files, caching, and any
# location-specific headers required by your deployment.
location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|woff|woff2|ttf|eot|mp4|webm|map|json|xml|txt|webmanifest)$ {
    access_log off;
    log_not_found off;
    include /etc/nginx/snippets/spx-static-assets-runtime.conf;
}

# 7. PROTOCOL HARDENING
# ----------------------------------------------------------------------
# Buffer sizes (client_body_buffer_size, large_client_header_buffers),
# timeout values (client_body_timeout, send_timeout), and keepalive
# settings (keepalive_requests) are intentionally omitted in Event Horizon
# core. Configure those in your deployment adapter or platform baseline
# (system-core, container image, ingress profile, etc.).

# 8. UPLOADS LOCKDOWN
# ----------------------------------------------------------------------
# Prevent PHP execution in wp-content/uploads.
location ~* ^/wp-content/uploads/.*\.php$ {
    return 444;
}

# 9. SENSITIVE FILE LOCKDOWN
# ----------------------------------------------------------------------
location ~* \.(env|ini|pl|py|jsp|asp|cgi|sh|sql|conf|bak|old|git|svn|hg)$ {
    return 444;
}

location ~* (wp-config\.php|\.htaccess|\.htpasswd|php\.ini|debug\.log) {
    return 444;
}

# 10. WELL-KNOWN & ACME CHALLENGE PASS-THROUGH
# ----------------------------------------------------------------------
# ^~ prefix wins over the regex lockdown blocks above — ACME challenge
# files and Apple App Site Association are served from the document root.
# Add proxy_pass here if your ACME tokens are served by an upstream.
location ^~ /.well-known/ {
}

# 11. HEALTH CHECK
# ----------------------------------------------------------------------
# Returns 200 only for IPs in the $spx_firewall_active bypass list
# (load balancers and health-check services must be listed there).
# No User-Agent check — probes legitimately send no UA.
location = /health {
    if ($spx_firewall_active) { return 444; }
    access_log off;
    return 200 "OK";
}

# 12. WORDPRESS LOGIN — firewall gate
# ----------------------------------------------------------------------
# Rate limiting and proxy_pass are runtime — add them in your server block
# or deployment adapter alongside this location block. Example:
#   location = /wp-login.php {
#       # (inherited — this block from spx-horizon-rules.conf fires first)
#   }
# Since Nginx does not allow duplicate location blocks, add your runtime
# config (limit_req, proxy_pass, include spx-dynamic-proxy-headers.conf)
# directly here if you include this file in a wrapping server block, OR
# define the location entirely in your server block and add the firewall
# check yourself: if ($spx_final_decision) { return 444; }
location = /wp-login.php {
    if ($spx_final_decision) { return 444; }
}

# 13. WORDPRESS ADMIN — firewall gate
# ----------------------------------------------------------------------
location /wp-admin/ {
    if ($spx_final_decision) { return 444; }
}

# 14. GRAPHQL — firewall gate + POST-only enforcement
# ----------------------------------------------------------------------
# GET queries expose parameters in logs and caches — enforce POST/OPTIONS.
location /graphql {
    if ($spx_final_decision) { return 444; }
    # Reject all methods except POST and OPTIONS (CORS preflight).
    if ($request_method !~ ^(POST|OPTIONS)$) { return 444; }
}

# 15. SUBMISSION CORE — firewall gate
# ----------------------------------------------------------------------
location /submission {
    if ($spx_final_decision) { return 444; }
}

# 16. XMLRPC.PHP — blocked entirely (brute-force / amplification target)
# ----------------------------------------------------------------------
location = /xmlrpc.php {
    return 444;
}

# 17. TUS RESUMABLE UPLOAD ENDPOINT
# ----------------------------------------------------------------------
# TUS clients (mobile recorders, upload SDKs) often send no User-Agent per
# spec §1.5. Add their egress IPs to the $spx_empty_ua_is_bad allowlist in
# 000-spx-horizon-logic.conf, or those clients will be ghosted.
# Add proxy_set_header TUS protocol headers and proxy_pass in your server
# block. Example:
#   location /files/ {  ← operator's server block
#       proxy_set_header Tus-Resumable   $http_tus_resumable;
#       proxy_set_header Upload-Offset   $http_upload_offset;
#       proxy_set_header Upload-Length   $http_upload_length;
#       proxy_set_header Upload-Metadata $http_upload_metadata;
#       proxy_pass http://tus_node_backend;
#   }
# This stub location ensures /files/ is not caught by location / below.
location /files/ {
    if ($spx_final_decision) { return 444; }
}

# 18. MAIN APP GATEWAY (Firewall Core)
# ----------------------------------------------------------------------
# The firewall decision is scoped to this catch-all so that the static
# asset location (Section 6) genuinely bypasses threat map evaluation.
# Add limit_conn, limit_req, include spx-dynamic-proxy-headers.conf, and
# proxy_pass in your deployment's server block — they are runtime config.
location / {
    # Block non-standard HTTP methods (Ghosting Protocol).
    if ($request_method !~ ^(GET|POST|HEAD|PUT|PATCH|DELETE|OPTIONS)$) {
        return 444;
    }

    if ($spx_final_decision) { return 444; }

    # CORS preflight — handled here so it does not interfere with
    # the trap or lockdown locations above.
    if ($request_method = OPTIONS) { return 204; }
}
