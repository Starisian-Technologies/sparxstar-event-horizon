# ======================================================================
# SPARXSTAR EVENT HORIZON v2.0 [SERVER RULES]
# ======================================================================

# 1. OPTIMIZED LOGGING
# ----------------------------------------------------------------------
# Buffer logs to reduce IOPS during attacks.
access_log /var/log/nginx/spx-blocked.log combined buffer=256k flush=5s if=$spx_log_trigger;

# 2. BOT TRAP (HONEY POT)
# ----------------------------------------------------------------------
# Add Disallow: /spx-trap in robots.txt. If anything hits this, ghost it.
location = /spx-trap {
    access_log /var/log/nginx/spx-blocked.log combined;
    return 444;
}

# 3. STATIC ASSET BYPASS (Performance & Safety)
# ----------------------------------------------------------------------
# Serve images/fonts/css immediately. Bypass rate limits and firewall regex.
location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|woff|woff2|ttf|eot|mp4|webm)$ {
    access_log off;
    log_not_found off;
    expires max;
    try_files $uri =404;
}

# 4. GLOBAL RATE LIMITING
# ----------------------------------------------------------------------
# Applied to everything NOT caught by the static block above.
limit_conn spx_conn 50;
limit_req  zone=spx_req burst=30 nodelay;

# 5. THE EVENT HORIZON (Firewall Core)
# ----------------------------------------------------------------------
set $spx_block 0;

# Check aggregation map
if ($spx_threat_detected) {
    set $spx_block 1;
}

# Check Emergency Bypass (Safe Mode)
# If header X-SPX-Bypass is true, force block to 0
if ($spx_firewall_active = 0) {
    set $spx_block 0;
}

# Drop Hammer
if ($spx_block) {
    return 444;
}

# 6. PROTOCOL HARDENING
# ----------------------------------------------------------------------
# Allow CORS/Preflight
if ($request_method = OPTIONS) {
    return 204;
}
# Restrict Methods (Enterprise Strictness)
if ($request_method !~ ^(GET|POST|HEAD|PUT|PATCH|DELETE|OPTIONS)$) {
    return 444;
}

# Header & Buffer Hardening (Anti-Overflow / Anti-Smuggling)
client_body_buffer_size 128k;
client_max_body_size 100M;
client_header_buffer_size 2k;
large_client_header_buffers 4 8k;

# Timeout Protection (Slowloris)
client_body_timeout 10s;
client_header_timeout 10s;
send_timeout 10s;

# HTTP/2 Protection
http2_max_requests 1000;
# http2_idle_timeout 10s; # Uncomment for newer Nginx versions

# 7. UPLOADS LOCKDOWN
# ----------------------------------------------------------------------
# Prevent PHP execution in wp-content/uploads
location ~* ^/wp-content/uploads/.*\.php$ {
    deny all;
    return 444;
}

# 8. SENSITIVE FILE LOCKDOWN
# ----------------------------------------------------------------------
location ~* \.(env|ini|pl|py|jsp|asp|cgi|sh|sql|conf|bak|old|git|svn|hg)$ {
    deny all;
    return 444;
}

location ~* (wp-config\.php|\.htaccess|\.htpasswd|php\.ini|debug\.log) {
    deny all;
    return 444;
}

# 9. SIGNATURES (Non-Map)
# ----------------------------------------------------------------------
# Bogus Graphics Exploit
if ($http_content_disposition ~* "\.php") {
    return 444;
}
# Missing Host Header
if ($host = "") {
    return 444;
}
