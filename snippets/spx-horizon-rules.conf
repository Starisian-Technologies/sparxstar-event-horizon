#
# FIREWALL RULES ONLY. This file contains no proxy_pass, no rate-limit
# enforcement, and no proxy_set_header directives — those are runtime
# concerns that belong in your server block.
#
# Include this file inside your server{} block:
#   include /etc/nginx/snippets/spx-horizon-rules.conf;
#
# Then define your own location blocks with proxy_pass and rate limits.
# Inside each proxied location, include the firewall gate check:
#   include /etc/nginx/snippets/spx-firewall-gate.conf;
#
# For security response headers: re-include spx-security-headers.conf
# inside any location that defines its own add_header directives, or
# Nginx will silently drop the server-level security headers for that
# location.
#
# For X-SPX-* threat signal propagation to upstream PHP, include:
#   include /etc/nginx/snippets/spx-dynamic-proxy-headers.conf;
# inside each proxied location (not at server level — see that file for
# the PHP consumer contract with Helios / Sirus).
#
# See tests/nginx-test-server.conf for a complete annotated operator
# example showing all location blocks with the correct includes.
# ======================================================================

# 1. LOGGING
# ----------------------------------------------------------------------
access_log /var/log/nginx/spx-blocked.log combined if=$spx_log_trigger;

# 2. SECURITY RESPONSE HEADERS (modular)
# ----------------------------------------------------------------------
# Applied globally to all responses from this server block.
# Re-include spx-security-headers.conf inside any location that defines
# its own add_header directives to preserve the security header set.
include /etc/nginx/snippets/spx-security-headers.conf;

# 3. BOT TRAP (HONEY POT)
# ----------------------------------------------------------------------
# Add Disallow: /spx-trap in robots.txt. Any hit ghosts the connection.
location = /spx-trap {
    access_log /var/log/nginx/spx-blocked.log combined;
    return 444;
}

# 4. DOT DIRECTORY TRAVERSAL LOCK
# ----------------------------------------------------------------------
# Block .git/, .svn/, .hg/ directory traversal paths.
# The extension lock below catches files ending in .git; this block
# catches directory paths like /.git/config.
location ~* /\.(git|svn|hg)/ {
    return 444;
}

# 5. STATIC ASSET BYPASS (Performance)
# ----------------------------------------------------------------------
# Nginx matches this regex location for static file extensions and
# bypasses the catch-all location / in your server block — no threat
# map evaluation runs for images, fonts, or stylesheets, saving CPU.
#
# Populate /etc/nginx/snippets/spx-static-assets-runtime.conf with
# your proxy_pass (and caching/expiry headers). Leave it empty to fall
# back to serving from the document root.
location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|woff|woff2|ttf|eot|mp4|webm|map|json|xml|txt|webmanifest)$ {
    access_log off;
    log_not_found off;
    include /etc/nginx/snippets/spx-static-assets-runtime.conf;
}

# 6. PROTOCOL HARDENING
# ----------------------------------------------------------------------
# Buffer sizes, timeouts, and keepalive settings are omitted from Event
# Horizon core — configure them in your deployment adapter or platform
# baseline (system-core, container image, ingress profile, etc.).

# 7. UPLOADS LOCKDOWN
# ----------------------------------------------------------------------
# Prevent PHP execution in wp-content/uploads.
location ~* ^/wp-content/uploads/.*\.php$ {
    return 444;
}

# 8. SENSITIVE FILE LOCKDOWN
# ----------------------------------------------------------------------
location ~* \.(env|ini|pl|py|jsp|asp|cgi|sh|sql|conf|bak|old|git|svn|hg)$ {
    return 444;
}

location ~* (wp-config\.php|\.htaccess|\.htpasswd|php\.ini|debug\.log) {
    return 444;
}

# 9. XMLRPC.PHP — blocked entirely (brute-force / amplification target)
# ----------------------------------------------------------------------
location = /xmlrpc.php {
    return 444;
}

# 10. HEALTH CHECK
# ----------------------------------------------------------------------
# Self-contained: returns 200 directly, no upstream required.
# Only reachable from IPs in the $spx_firewall_active bypass list
# (load balancers and health-check services must be listed there).
# No User-Agent check — probes legitimately send no UA.
location = /health {
    if ($spx_firewall_active) { return 444; }
    access_log off;
    return 200 "OK";
}
