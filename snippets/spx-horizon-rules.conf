# 1. OPTIMIZED LOGGING
# ----------------------------------------------------------------------
# Buffer logs to reduce IOPS during attacks.
access_log /var/log/nginx/spx-blocked.log combined buffer=256k flush=5s if=$spx_log_trigger;

# 2. SECURITY RESPONSE HEADERS
# ----------------------------------------------------------------------
# Applied globally to all responses from this server block.

# HSTS — 1-year max-age. Add includeSubDomains only after all subdomains
# are confirmed HTTPS-ready.
add_header Strict-Transport-Security "max-age=31536000" always;

# Prevent MIME-type sniffing.
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking — SAMEORIGIN; CSP frame-ancestors is the modern control.
add_header X-Frame-Options "SAMEORIGIN" always;

# Referrer policy — origin only on cross-origin requests.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions policy — deny by default; open per-route where required.
# microphone=(self): required for Starmus audio recording service.
# camera=(self): reserved for future video features; keeps policy consistent.
add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self), usb=(), payment=(), accelerometer=(), gyroscope=(), magnetometer=(), publickey-credentials-get=(self), fullscreen=(self)" always;

# Content Security Policy — base policy; tighten per route as needed.
# NOTE: 'unsafe-inline' and 'unsafe-eval' are required by the upstream
# WordPress/application stack and match the system-core production policy.
# Remove these directives and adopt nonces/hashes once the application
# supports it (see README — "CSP hardening roadmap").
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https:;" always;

# 3. SPARXSTAR EDGE-AUTH HEADER SANITISATION
# ----------------------------------------------------------------------
# Default: all SPARXSTAR headers evaluate to "" — blocks client spoofing.
# Trusted Cloudflare Worker path: headers preserved via $spx_pass_sparxstar_*
# maps (active only when X-Worker-Origin-Secret matches the shared secret
# in /etc/nginx/secrets/worker-secret.conf).
# Never forward the worker shared secret to upstreams (avoid logging/leakage).
proxy_set_header X-Worker-Origin-Secret "";
proxy_set_header X-SPARXSTAR-User       $spx_pass_sparxstar_user;
proxy_set_header X-SPARXSTAR-Session    $spx_pass_sparxstar_session;
proxy_set_header X-SPARXSTAR-Roles      $spx_pass_sparxstar_roles;
proxy_set_header X-SPARXSTAR-Issued     $spx_pass_sparxstar_issued;
proxy_set_header X-SPARXSTAR-Expires    $spx_pass_sparxstar_expires;
proxy_set_header X-SPARXSTAR-Site       $spx_pass_sparxstar_site;
proxy_set_header X-SPARXSTAR-AuthLevel  $spx_pass_sparxstar_authlevel;

# 4. STANDARD PROXY HEADERS
# ----------------------------------------------------------------------
# $remote_addr is already the real visitor IP at this point: the RealIP
# module (set_real_ip_from + real_ip_header CF-Connecting-IP, configured in
# spx-cloudflare-trust.conf or the wrapping nginx.conf) has already replaced
# $remote_addr with the IP from CF-Connecting-IP for connections arriving from
# trusted Cloudflare edge nodes. X-Forwarded-For is therefore set to $remote_addr
# rather than $proxy_add_x_forwarded_for to discard any client-supplied chain.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_set_header X-Request-ID      $request_id;

proxy_http_version 1.1;
proxy_set_header   Connection "";

# 4a. THREAT SIGNAL PROPAGATION HEADERS
# ----------------------------------------------------------------------
# Event Horizon annotates every proxied request with server-computed threat
# intelligence. PHP (Helios / Sirus) reads these via $_SERVER['HTTP_X_SPX_*'].
#
# Security model: proxy_set_header OVERWRITES the header on the proxied
# request, so any client-supplied X-SPX-* values are always discarded and
# replaced by server-computed map variables. Spoofing from outside Nginx
# is not possible. PHP consumers MUST additionally confirm the request
# arrived via Event Horizon before trusting these values — check for the
# presence of CF-RAY or gate on $spx_is_trusted_worker.
#
# PHP usage example (Helios / Sirus):
#   $is_threat = (int)($_SERVER['HTTP_X_SPX_THREAT']  ?? 0);  // 0|1 boolean flag
#   $risk      = (int)($_SERVER['HTTP_X_SPX_RISK']    ?? 0);  // 0–100 triage score
#   $geo       = (int)($_SERVER['HTTP_X_SPX_GEO_RISK'] ?? 0); // 0|1 boolean flag
#   $bot       = (int)($_SERVER['HTTP_X_SPX_BOT']     ?? 0);  // 0|1 boolean flag
#   $reason    = rtrim($_SERVER['HTTP_X_SPX_REASON']  ?? '', '|');
#   if ($is_threat) { do_action('helios_high_risk_request', $risk, $reason); }
#
# X-SPX-Reason format: pipe-delimited active signals with trailing "|".
#   Possible tokens: sqli | bad_uri | bot | bad_ref | bad_post |
#                    content_disp | missing_host | geo_risk
proxy_set_header X-SPX-Threat   $spx_threat_detected;
proxy_set_header X-SPX-Risk     $spx_risk_score;
proxy_set_header X-SPX-Geo-Risk $spx_high_risk_geo;
proxy_set_header X-SPX-Bot      $spx_bad_bot;
proxy_set_header X-SPX-Reason   "$spx_rflag_sqli$spx_rflag_uri$spx_rflag_bot$spx_rflag_ref$spx_rflag_post$spx_rflag_cd$spx_rflag_host$spx_rflag_geo";

# 5. BOT TRAP (HONEY POT)
# ----------------------------------------------------------------------
# Add Disallow: /spx-trap in robots.txt. If anything hits this, ghost it.
location = /spx-trap {
    access_log /var/log/nginx/spx-blocked.log combined;
    return 444;
}

# 6. DOT DIRECTORY TRAVERSAL LOCK
# ----------------------------------------------------------------------
# Block .git/, .svn/, .hg/ directory paths.
# The extension lock below only catches files ending in .git, so this is needed
# to block directory traversal like /.git/config.
location ~* /\.(git|svn|hg)/ {
    return 444;
}

# 7. STATIC ASSET BYPASS (Performance & Safety)
# ----------------------------------------------------------------------
# Proxy images/fonts/css directly to the upstream. Bypasses firewall regex
# to save CPU on high-volume static traffic.
location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|woff|woff2|ttf|eot|mp4|webm|map|json|xml|txt|webmanifest)$ {
    access_log off;
    log_not_found off;
    proxy_pass http://varnish_backend;
}

# 8. PROTOCOL HARDENING
# ----------------------------------------------------------------------

# Header & Buffer Hardening (Anti-Overflow / Anti-Smuggling)
client_body_buffer_size 128k;
client_max_body_size 100M;
client_header_buffer_size 2k;
large_client_header_buffers 4 8k;

# Timeout Protection (Slowloris)
client_body_timeout 10s;
client_header_timeout 10s;
send_timeout 10s;

# Connection Keepalive Protection
keepalive_requests 1000;
# http2_idle_timeout 10s; # Uncomment for newer Nginx versions

# 9. UPLOADS LOCKDOWN
# ----------------------------------------------------------------------
# Prevent PHP execution in wp-content/uploads
location ~* ^/wp-content/uploads/.*\.php$ {
    return 444;
}

# 10. SENSITIVE FILE LOCKDOWN
# ----------------------------------------------------------------------
location ~* \.(env|ini|pl|py|jsp|asp|cgi|sh|sql|conf|bak|old|git|svn|hg)$ {
    return 444;
}

location ~* (wp-config\.php|\.htaccess|\.htpasswd|php\.ini|debug\.log) {
    return 444;
}

# 11. WELL-KNOWN & ACME CHALLENGE PASS-THROUGH
# ----------------------------------------------------------------------
# Allow .well-known structure for SSL certs, Apple App Site Association, etc.
# ^~ prefix wins over the regex location blocks above.
location ^~ /.well-known/ {
    proxy_pass http://varnish_backend;
}

# 12. HEALTH CHECK
# ----------------------------------------------------------------------
# Unconditionally exempt from UA checks and rate limiting.
# Varnish backend probes and load balancers often send no User-Agent.
location = /health {
    if ($spx_firewall_active) { return 444; }
    access_log off;
    return 200 "OK";
}

# 13. WORDPRESS LOGIN — strict inner-guard rate limit
# ----------------------------------------------------------------------
location = /wp-login.php {
    if ($spx_final_decision) { return 444; }
    limit_req zone=spx_wp_login burst=3 nodelay;
    proxy_pass http://varnish_backend;
}

# 14. WORDPRESS ADMIN — rate limited
# ----------------------------------------------------------------------
location /wp-admin/ {
    if ($spx_final_decision) { return 444; }
    limit_req zone=spx_general burst=20 nodelay;
    proxy_pass http://varnish_backend;
}

# 15. GRAPHQL — POST only (GET queries expose params in logs)
# ----------------------------------------------------------------------
location /graphql {
    if ($spx_final_decision) { return 444; }
    limit_req zone=spx_graphql burst=10 nodelay;

    # Reject all methods except POST and OPTIONS (CORS preflight).
    if ($request_method !~ ^(POST|OPTIONS)$) { return 444; }

    # Prevent CPU-exhaustion via oversized queries.
    client_max_body_size 1m;

    proxy_pass http://varnish_backend;
}

# 16. SUBMISSION CORE — rate-limited separately
# ----------------------------------------------------------------------
location /submission {
    if ($spx_final_decision) { return 444; }
    limit_req zone=spx_submission burst=10 nodelay;
    client_max_body_size 64m;
    proxy_pass http://varnish_backend;
}

# 17. XMLRPC.PHP — blocked entirely (brute-force / amplification target)
# ----------------------------------------------------------------------
location = /xmlrpc.php {
    return 444;
}

# 18. TUS RESUMABLE UPLOAD ENDPOINT
# ----------------------------------------------------------------------
# Unconditionally exempt from UA checks and rate limiting.
# TUS clients (mobile recorders, upload SDKs) often send no User-Agent per
# spec §1.5. Rate-limiting uploads would break resumable sessions on slow
# connections.
location /files/ {
    # Do NOT buffer — critical for TUS protocol operation.
    proxy_request_buffering off;
    proxy_buffering         off;
    # No body size limit for resumable uploads.
    client_max_body_size    0;
    # Allow long-running TUS sessions (1 hour).
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_connect_timeout   75s;

    # Forward TUS protocol headers to the Node ingestion server.
    proxy_set_header Tus-Resumable    $http_tus_resumable;
    proxy_set_header Upload-Offset    $http_upload_offset;
    proxy_set_header Upload-Length    $http_upload_length;
    proxy_set_header Upload-Metadata  $http_upload_metadata;

    proxy_pass http://tus_node_backend;
}

# 19. MAIN APP GATEWAY (Firewall Core + Application Proxy)
# ----------------------------------------------------------------------
# The firewall decision is scoped here so the static asset location (above)
# genuinely bypasses threat checks.
location / {
    limit_conn spx_conn 50;
    limit_req  zone=spx_req burst=40 nodelay;

    # Block non-standard HTTP methods (Ghosting Protocol)
    if ($request_method !~ ^(GET|POST|HEAD|PUT|PATCH|DELETE|OPTIONS)$) {
        return 444;
    }

    if ($spx_final_decision) { return 444; }

    # CORS preflight — scoped to main app only; does not interfere with
    # trap or lockdown locations.
    if ($request_method = OPTIONS) { return 204; }

    proxy_pass http://varnish_backend;
}

# 20. SPARXSTAR WORKER HEADER PASS-THROUGH REMINDER
# ----------------------------------------------------------------------
# Content-Disposition (.php) and missing Host-header threats are handled
# via $spx_bad_content_disposition and $spx_missing_host maps in the
# Logic Core (000-spx-horizon-logic.conf) and aggregate through
# $spx_base_threat → $spx_threat_detected → $spx_final_decision,
# so they honour the emergency bypass and require no server-block if{}.
