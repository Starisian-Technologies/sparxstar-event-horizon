#
# Modular security response headers.
# spx-horizon-rules.conf includes this file at the server context so the
# headers apply to all responses by default.
#
# WHY MODULAR?
# Nginx's add_header inheritance model: when a location block defines its
# own add_header directive(s), it inherits NONE from the parent server
# context. Any location that sets custom response headers MUST also
# include this file to preserve the security header set.
#
# Example — location with custom headers:
#
#   location /api {
#       include /etc/nginx/snippets/spx-security-headers.conf;
#       add_header X-API-Version "2" always;
#       proxy_pass http://your_backend;
#   }
#
# Omitting the include above would silently drop HSTS, CSP, and all
# other security headers for every response from that location.
# ======================================================================

# HSTS — 1-year max-age. Add includeSubDomains only after all subdomains
# are confirmed HTTPS-ready.
add_header Strict-Transport-Security "max-age=31536000" always;

# Prevent MIME-type sniffing.
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking — SAMEORIGIN; CSP frame-ancestors is the modern control.
add_header X-Frame-Options "SAMEORIGIN" always;

# Referrer policy — origin only on cross-origin requests.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions policy — deny by default; open per-route where required.
# microphone=(self): required for Starmus audio recording service.
# camera=(self): reserved for future video features; keeps policy consistent.
add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self), usb=(), payment=(), accelerometer=(), gyroscope=(), magnetometer=(), publickey-credentials-get=(self), fullscreen=(self)" always;

# Content Security Policy — base policy; tighten per route as needed.
# NOTE: 'unsafe-inline' and 'unsafe-eval' are required by the upstream
# WordPress/application stack and match the system-core production policy.
# Remove these directives and adopt nonces/hashes once the application
# supports it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https:;" always;
