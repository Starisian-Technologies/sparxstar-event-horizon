#
# This file is included by the static-asset bypass location inside
# spx-horizon-rules.conf:
#
#   location ~* \.(jpg|jpeg|gif|png|css|js|...)$ {
#       access_log off;
#       log_not_found off;
#       include /etc/nginx/snippets/spx-static-assets-runtime.conf;
#   }
#
# Populate this file with your deployment's proxy_pass (and any
# caching, expiry, or location-specific header directives). Example:
#
#   proxy_pass http://varnish_backend;
#   proxy_http_version 1.1;
#   expires 30d;
#   add_header Cache-Control "public, no-transform";
#
# If this file is left empty, Nginx will attempt to serve the asset
# from the server's document root (root directive) and return 404 if
# the file is not present on disk.
#
# NOTE: There is no spx-firewall-gate.conf include here — the static
# asset bypass is intentional. Bypassing the firewall threat maps for
# images, fonts, and stylesheets saves CPU on high-volume static
# traffic. Threat map evaluation only runs for requests that reach the
# catch-all location / defined in your server block.
