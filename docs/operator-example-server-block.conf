# SPARXSTAR EVENT HORIZON v2.1 — Operator Reference Server Block
# © 2026 Starisian Technologies — Proprietary and Confidential
#
# This file shows how to wire Event Horizon into your server block.
# Copy and adapt the relevant sections. CI may use this file directly as
# a test server block, but do not include it directly in production.
#
# ── What Event Horizon ships ──────────────────────────────────────────
#   conf.d/000-spx-horizon-logic.conf       Maps and aggregation,
#                                           worker trust, risk scoring.
#   conf.d/spx-cloudflare-trust.conf        RealIP trust list.
#   maps/high-risk-geo.map                  Country risk amplifier fragment.
#   snippets/spx-dynamic-proxy-headers.conf X-SPX-* / X-SPARXSTAR-* output.
#
# ── What Event Horizon does NOT ship ─────────────────────────────────
#   Location blocks, return directives, add_header directives, proxy_pass,
#   and limit_req directives are operator runtime decisions. They belong
#   in your server block, not in Event Horizon.
#   Required limit_req_zone / limit_conn_zone declarations for zones used
#   below (spx_conn, spx_req, spx_wp_login, spx_graphql, spx_submission,
#   spx_general) must be defined by system-core in http{}.
#
# ── THE ONE CHECK RULE ────────────────────────────────────────────────
#   Place this single line at the top of every proxied location block:
#     if ($spx_final_decision) { return 444; }
#   This is the only threat-intelligence enforcement needed. Protocol or
#   method guards (for example: method allowlists) may use additional
#   return 444 checks as runtime controls.
#   All threat signals are aggregated into $spx_final_decision by the map
#   directives in 000-spx-horizon-logic.conf. The Emergency Bypass
#   ($spx_firewall_active) is already factored in.
#
# ── SECURITY RESPONSE HEADERS ────────────────────────────────────────
#   Security response headers (HSTS, X-Content-Type-Options, X-Frame-Options,
#   CSP, Referrer-Policy, Permissions-Policy) are owned by your platform
#   baseline. system-core already provides these for all Starisian deployments.
#   Event Horizon does not ship response headers.
#
#   If you are NOT using system-core, add your own add_header directives
#   in your server block. Minimum recommended set:
#
#     add_header Strict-Transport-Security "max-age=31536000" always;
#     add_header X-Content-Type-Options    "nosniff" always;
#     add_header X-Frame-Options           "SAMEORIGIN" always;
#     add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
#     add_header Permissions-Policy        "geolocation=(), microphone=(self), camera=(self), usb=(), payment=()" always;
#     add_header Content-Security-Policy   "default-src 'self'; ..." always;
#
#   Re-include your security headers inside every location that defines
#   its own add_header directives — Nginx silently drops server-context
#   add_header for any location that sets at least one of its own.
#
# ── HOW TO USE X-SPX-* THREAT SIGNALS IN PHP ─────────────────────────
#   Include snippets/spx-dynamic-proxy-headers.conf inside each proxied
#   location. Event Horizon writes threat intelligence into X-SPX-* request
#   headers forwarded to PHP (consumed by Helios / Sirus). Do not include
#   this at server level — it must run inside each location's proxy context.
#
# For production, replace 127.0.0.1:6081 / 127.0.0.1:1080 with your
# actual backend addresses, and adjust rate-limit burst values.
# ======================================================================

upstream varnish_backend {
    server 127.0.0.1:6081;  # Replace with your application backend
    keepalive 32;
}

upstream tus_node_backend {
    server 127.0.0.1:1080;  # Replace with your TUS upload backend
    keepalive 8;
}

server {
    listen 80 default_server;
    server_name localhost;
    root /var/www/html;
    index index.html;

    # Standard proxy headers — inherit into all location blocks that do
    # not define their own proxy_set_header (Nginx drops server-level
    # proxy_set_header for any location that defines at least one).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header X-Request-ID      $request_id;
    proxy_set_header Connection        "";
    proxy_http_version 1.1;

    # ── Cloudflare RealIP trust ───────────────────────────────────────
    # spx-cloudflare-trust.conf is already loaded at http context via
    # conf.d/. Uncomment the include below only if your deployment
    # requires it at server context (e.g. multi-tenant setups with
    # per-server trust).
    # include /etc/nginx/conf.d/spx-cloudflare-trust.conf;

    # ── Blocked traffic access log ───────────────────────────────────
    # Only emits log lines when $spx_log_trigger is set (i.e. the firewall
    # evaluated a threat). Clean traffic produces no log entries here.
    access_log /var/log/nginx/spx-blocked.log combined buffer=256k flush=5s if=$spx_log_trigger;

    # ── BOT TRAP (HONEYPOT) ───────────────────────────────────────────
    # Add Disallow: /spx-trap in robots.txt. Any hit ghosts the connection.
    location = /spx-trap {
        access_log /var/log/nginx/spx-blocked.log combined;
        if ($spx_firewall_active) { return 444; }
    }

    # ── DOT DIRECTORY TRAVERSAL LOCK ─────────────────────────────────
    # Block .git/, .svn/, .hg/ directory traversal paths.
    # The extension lock below catches files ending in .git; this block
    # catches directory paths like /.git/config.
    location ~* /\.(git|svn|hg)/ {
        if ($spx_firewall_active) { return 444; }
    }

    # ── STATIC ASSET BYPASS (Performance) ────────────────────────────
    # Nginx matches this regex location for static file extensions and
    # bypasses the catch-all location / — no threat map evaluation runs
    # for images, fonts, or stylesheets, saving CPU.
    #
    # Add your proxy_pass here (and any caching/expiry directives).
    # Leave it with only access_log off to fall back to document root.
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|woff|woff2|ttf|eot|mp4|webm|map|json|xml|txt|webmanifest)$ {
        access_log off;
        log_not_found off;
        # proxy_pass http://varnish_backend;
        # expires 30d;
        # add_header Cache-Control "public, no-transform";
    }

    # ── UPLOADS LOCKDOWN ─────────────────────────────────────────────
    # Prevent PHP execution in wp-content/uploads.
    location ~* ^/wp-content/uploads/.*\.php$ {
        if ($spx_firewall_active) { return 444; }
    }

    # ── SENSITIVE FILE LOCKDOWN ───────────────────────────────────────
    location ~* \.(env|ini|pl|py|jsp|asp|cgi|sh|sql|conf|bak|old|git|svn|hg)$ {
        if ($spx_firewall_active) { return 444; }
    }

    location ~* (wp-config\.php|\.htaccess|\.htpasswd|php\.ini|debug\.log) {
        if ($spx_firewall_active) { return 444; }
    }

    # ── XMLRPC.PHP — blocked entirely ────────────────────────────────
    # Brute-force / amplification target. Ghost all requests.
    location = /xmlrpc.php {
        if ($spx_firewall_active) { return 444; }
    }

    # ── HEALTH CHECK ─────────────────────────────────────────────────
    # Self-contained: returns 200 directly, no upstream required.
    # Only reachable from IPs in the $spx_firewall_active bypass list
    # (load balancers and health-check services must be listed there).
    # No User-Agent check — probes legitimately send no UA.
    location = /health {
        if ($spx_firewall_active) { return 444; }
        access_log off;
        return 200 "OK";
    }

    # ── OPERATOR RUNTIME LOCATIONS ────────────────────────────────────
    # Each proxied location:
    #   1. Enforces the firewall gate:
    #        if ($spx_final_decision) { return 444; }
    #      This single check honours all threat signals AND the Emergency
    #      Bypass. Do not add additional if{} blocks for threat detection.
    #   2. Includes spx-dynamic-proxy-headers.conf — injects X-SPX-*
    #      threat signals and X-SPARXSTAR-* identity headers for PHP.
    #   3. Sets proxy_pass to the appropriate upstream.

    # Header echo — reflects received proxy headers back as response
    # headers so tests can verify X-SPX-* / X-SPARXSTAR-* propagation.
    location = /echo-headers {
        if ($spx_final_decision) { return 444; }
        include /etc/nginx/snippets/spx-dynamic-proxy-headers.conf;
        proxy_pass http://varnish_backend;
    }

    # ACME challenge and well-known pass-through.
    # ^~ wins over the extension-based lockdown regex above.
    location ^~ /.well-known/ {
        proxy_pass http://varnish_backend;
    }

    # WordPress login — tighter rate limit.
    location = /wp-login.php {
        if ($spx_final_decision) { return 444; }
        include /etc/nginx/snippets/spx-dynamic-proxy-headers.conf;
        proxy_pass http://varnish_backend;
    }

    # WordPress admin.
    location /wp-admin/ {
        if ($spx_final_decision) { return 444; }
        include /etc/nginx/snippets/spx-dynamic-proxy-headers.conf;
        proxy_pass http://varnish_backend;
    }

    # GraphQL — POST and OPTIONS only. GET queries expose parameters in
    # logs and caches.
    location /graphql {
        if ($spx_final_decision) { return 444; }
        if ($request_method !~ ^(POST|OPTIONS)$) { return 444; }
        include /etc/nginx/snippets/spx-dynamic-proxy-headers.conf;
        proxy_pass http://varnish_backend;
    }

    # Submission endpoint.
    location /submission {
        if ($spx_final_decision) { return 444; }
        include /etc/nginx/snippets/spx-dynamic-proxy-headers.conf;
        proxy_pass http://varnish_backend;
    }

    # TUS resumable uploads. TUS clients (mobile recorders, upload SDKs)
    # often send no User-Agent per spec §1.5 — add their egress IPs to
    # the $spx_empty_ua_is_bad allowlist so they are not ghosted.
    location /files/ {
        if ($spx_final_decision) { return 444; }
        proxy_set_header Tus-Resumable   $http_tus_resumable;
        proxy_set_header Upload-Offset   $http_upload_offset;
        proxy_set_header Upload-Length   $http_upload_length;
        proxy_set_header Upload-Metadata $http_upload_metadata;
        proxy_pass http://tus_node_backend;
    }

    # Main application catch-all. Method guard, then firewall gate,
    # then proxy clean traffic to the application backend.
    location / {
        if ($spx_final_decision) { return 444; }
        if ($request_method !~ ^(GET|POST|HEAD|PUT|PATCH|DELETE|OPTIONS)$) { return 444; }
        if ($request_method = OPTIONS) { return 204; }
        include /etc/nginx/snippets/spx-dynamic-proxy-headers.conf;
        proxy_pass http://varnish_backend;
    }
}

# CI TEST STUB ONLY (remove in production): simulates Varnish/Apache by
# serving files from disk and echoing received proxy headers as response headers.
server {
    listen 6081;
    server_name localhost;
    root /var/www/html;

    location = /echo-headers {
        add_header X-SPX-Threat-Echo          $http_x_spx_threat          always;
        add_header X-SPX-Risk-Echo            $http_x_spx_risk            always;
        add_header X-SPX-Geo-Risk-Echo        $http_x_spx_geo_risk        always;
        add_header X-SPX-Bot-Echo             $http_x_spx_bot             always;
        add_header X-SPX-Reason-Echo          $http_x_spx_reason          always;
        add_header X-SPARXSTAR-User-Echo      $http_x_sparxstar_user      always;
        add_header X-SPARXSTAR-Session-Echo   $http_x_sparxstar_session   always;
        add_header X-SPARXSTAR-Roles-Echo     $http_x_sparxstar_roles     always;
        add_header X-SPARXSTAR-AuthLevel-Echo $http_x_sparxstar_authlevel always;
        return 200 "headers_echo";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

